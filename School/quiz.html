: "B", "text": "专政的方法"}, {"key": "C", "text": "民主的方法"}, {"key": "D", "text": "教育的方法"}], "answers": ["B"], "explanation": "敌我矛盾是对抗性矛盾，应采用专政（即强制）的方法来解决。A项说服、C项民主、D项教育是解决人民内部矛盾的方法，不适合解决敌我对抗性矛盾。教材对应「关于正确处理人民内部矛盾的问题」。", "source": "MZT概论教研室公众号"}, {"id": 129, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "单选", "question": "MZD在1957年2月所作的《关于正确处理人民内部矛盾的问题》的报告中，系统论述了社会主义社会矛盾的理论。MZD强调，社会主义国家政治生活的主题是：", "options": [{"key": "A", "text": "正确区分和处理两类不同性质矛盾的问题"}, {"key": "B", "text": "正确处理人民内部矛盾的问题"}, {"key": "C", "text": "正确处理敌我矛盾的问题"}, {"key": "D", "text": "正确认识和处理阶级斗争的问题"}], "answers": ["B"], "explanation": "MZD在 1957年 2 月的报告中明确指出：社会主义国家政治生活的主题是正确处理人民内部矛盾的问题——因为社会主义改造完成后，敌我矛盾退居次要地位，大量是人民内部矛盾。A项是更广泛的命题，但报告强调的「主题」特指人民内部矛盾；C、D项不是社会主义国家政治生活的「主题」。教材对应「关于正确处理人民内部矛盾的问题」。", "source": "MZT概论教研室公众号"}, {"id": 130, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "单选", "question": "关于人民内部矛盾表述正确的是：", "options": [{"key": "A", "text": "人民内部矛盾是由于人民根本利益不一致导致的"}, {"key": "B", "text": "领导同被领导之间的矛盾属于人民内部矛盾"}, {"key": "C", "text": "工人阶级和民族资产阶级之间的矛盾不属于人民内部矛盾"}, {"key": "D", "text": "人民内部矛盾是固定不变的，不会随条件的变化而发生转化"}], "answers": ["B"], "explanation": "B项领导同被领导之间的矛盾属于人民内部矛盾。A项错误：人民内部矛盾产生于人民根本利益一致基础上的局部利益、认识不一致，而非「根本利益不一致」；C项错误：在新中国时期，工人阶级和民族资产阶级的矛盾兼有对抗性和非对抗性，在团结合作的层面上属人民内部矛盾；D项错误：人民内部矛盾处理不当会转化为对抗性矛盾，并非固定不变。教材对应「关于正确处理人民内部矛盾的问题」。", "source": "MZT概论教研室公众号"}, {"id": 131, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "单选", "question": "在人民民主专政体制下，正确处理两类不同性质社会矛盾的基本方法是：", "options": [{"key": "A", "text": "依法严惩和说服教育"}, {"key": "B", "text": "暴力镇压和说服教育"}, {"key": "C", "text": "批评和团结"}, {"key": "D", "text": "专政和民主"}], "answers": ["D"], "explanation": "两类不同性质社会矛盾的基本方法是「专政和民主」——对敌我矛盾用专政、对人民内部矛盾用民主。A项「依法严惩」措辞过于侧重一端；B项「暴力镇压」是专政的极端方式；C项是处理人民内部矛盾的具体方法，不能涵盖两类矛盾。教材对应「关于正确处理人民内部矛盾的问题」。", "source": "MZT概论教研室公众号"}, {"id": 132, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "单选", "question": "解决科学文化领域的矛盾应坚持的方针是：", "options": [{"key": "A", "text": "百家争鸣、百花齐放"}, {"key": "B", "text": "团结-批评-团结"}, {"key": "C", "text": "文化交流和艺术实践"}, {"key": "D", "text": "异域文化之间的交流与碰撞"}], "answers": ["A"], "explanation": "解决科学文化领域矛盾应坚持「百花齐放、百家争鸣」——艺术上百花齐放、科学上百家争鸣，发扬学术民主。B项「团结—批评—团结」是一般政治领域处理人民内部矛盾的总公式；C、D项不是党在科学文化领域的标准方针表述。教材对应「关于正确处理人民内部矛盾的问题（不同领域矛盾的处理方针）」。", "source": "MZT概论教研室公众号"}, {"id": 133, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "单选", "question": "MZD明确提出要走一条有别于苏联的中国工业化道路的著述是：", "options": [{"key": "A", "text": "《论十大关系》"}, {"key": "B", "text": "《关于正确处理人民内部矛盾的问题》"}, {"key": "C", "text": "《为争取国家财政经济状况基本好转而斗争》"}, {"key": "D", "text": "《在扩大的中央工作会议上的讲话》"}], "answers": ["B"], "explanation": "MZD在《关于正确处理人民内部矛盾的问题》中明确提出要走一条有别于苏联的中国工业化道路，强调正确处理重工业、轻工业、农业的关系。A项《论十大关系》开始了相关探索（实际提出了工业化道路问题），但「明确提出走有别于苏联道路」的标志性表述是 B；C、D项不是中国工业化道路问题的标志性著述。教材对应「MZD、周恩来等领导同志对走中国工业化道路的思考」。", "source": "MZT概论教研室公众号"}, {"id": 134, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "单选", "question": "促使我党思考和探索如何走中国工业化道路的直接原因是：", "options": [{"key": "A", "text": "以苏为鉴，吸取苏联在建设社会主义中的教训"}, {"key": "B", "text": "我国重工业、农业和轻工业发展的比例失调"}, {"key": "C", "text": "我国生产力落后，经济基础薄弱"}, {"key": "D", "text": "受苏联的影响，强调重工业的发展。"}], "answers": ["A"], "explanation": "1956年苏共二十大暴露了苏联模式的弊端，MZD提出「以苏为鉴」，吸取苏联在建设社会主义中的教训，这是促使党思考探索中国工业化道路的直接原因。B项是国内具体问题，但根本动因来自「以苏为鉴」的战略反思；C项是长期客观条件，不是「直接原因」；D项是要矫正的现象，不是「思考探索」的直接动因。教材对应「MZD、周恩来等领导同志对走中国工业化道路的思考」。", "source": "MZT概论教研室公众号"}, {"id": 135, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "单选", "question": "走中国工业化道路的关键问题是：", "options": [{"key": "A", "text": "正确处理重工业和轻工业、农业的关系"}, {"key": "B", "text": "正确处理人民内部的矛盾"}, {"key": "C", "text": "正确处理两类不同性质的矛盾"}, {"key": "D", "text": "调动一切积极因素为社会主义建设服务"}], "answers": ["A"], "explanation": "走中国工业化道路的关键问题是正确处理重工业和轻工业、农业的关系——既要优先发展重工业，又要适当发展轻工业、农业。B、C项是社会主义矛盾理论范畴；D项是《论十大关系》的基本方针，不是工业化道路的「关键问题」。教材对应「MZD、周恩来等领导同志对走中国工业化道路的思考」。", "source": "MZT概论教研室公众号"}, {"id": 136, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "单选", "question": "我国走工业化道路的根本原因是：", "options": [{"key": "A", "text": "新中国的工业基础十分薄弱"}, {"key": "B", "text": "中国民族工业发展已经具有了深厚的基础"}, {"key": "C", "text": "是中国共产党重视国家工业化的一贯政策"}, {"key": "D", "text": "实现民族独立和国家富强的内在要求和必要条件"}], "answers": ["D"], "explanation": "我国走工业化道路的根本原因是实现民族独立和国家富强的内在要求和必要条件——工业化是国家强大和现代化的物质基础。A项是工业薄弱的现状，是迫切性的表现而非「根本原因」；B项错误，中国民族工业基础薄弱；C项是党的一贯政策的表现，不是「根本原因」。教材对应「MZD、周恩来等领导同志对走中国工业化道路的思考」。", "source": "MZT概论教研室公众号"}, {"id": 137, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "单选", "question": "实现我国工业化应坚持的方针不包括：", "options": [{"key": "A", "text": "“两条腿走路”"}, {"key": "B", "text": "农业为基础，工业为主导，以农轻重为序"}, {"key": "C", "text": "中央工业和地方工业并举"}, {"key": "D", "text": "国家、生产单位和生产者个人利益兼顾"}], "answers": ["D"], "explanation": "实现我国工业化的方针包括 A「两条腿走路」、B「农业为基础、工业为主导、以农轻重为序」、C「中央工业和地方工业并举」等。D项「国家、生产单位、生产者个人利益兼顾」是分配关系（《论十大关系》中讲的国家、生产单位与生产者个人三者关系的处理原则），不属于工业化方针范畴。教材对应「MZD、周恩来等领导同志对走中国工业化道路的思考」。", "source": "MZT概论教研室公众号"}, {"id": 138, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "单选", "question": "在社会主义建设道路初步探索过程中，关于生产资料所有制调整方面，提出了“三个主体，三个补充”设想的是：", "options": [{"key": "A", "text": "MZD"}, {"key": "B", "text": "刘少奇"}, {"key": "C", "text": "陈云"}, {"key": "D", "text": "DXP"}], "answers": ["C"], "explanation": "选项里的几位人物都重要，坑在把贡献归属串错；本题只认「三个主体，三个补充」这件事的准确归属。陈云在 1956年党的八大上提出「三个主体，三个补充」设想——国家经营和集体经营为主体、个体经营为补充；计划生产为主体、自由生产为补充；国家市场为主体、自由市场为补充。这是初步探索期重要的理论成果。C项陈云是本题答案；A项MZD、B项刘少奇、D项DXP都不是题干所问。教材对应「如何看待社会主义建设道路的初步探索（陈云的探索贡献）」。", "source": "MZT概论教研室公众号"}, {"id": 139, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "单选", "question": "我党提出的“三个主体、三个补充”意味着：", "options": [{"key": "A", "text": "社会主义国家要消除商品经济"}, {"key": "B", "text": "发展商品生产会导致资本主义"}, {"key": "C", "text": "在我国经济建设发展过程中，也要发挥非公有制经济和市场的作用"}, {"key": "D", "text": "商品经济是资本主义的本质特征"}], "answers": ["C"], "explanation": "「三个主体、三个补充」在以公有制和计划经济为主体的同时给个体经营、自由生产、自由市场留出空间，意味着「我国经济建设要发挥非公有制经济和市场的作用」，是对商品经济和市场作用的早期认识。A、B、D项均与「三个补充」的精神相反。教材对应「如何看待社会主义建设道路的初步探索（陈云「三个主体、三个补充」的意义）」。", "source": "MZT概论教研室公众号"}, {"id": 140, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "单选", "question": "党的八大提出的经济建设的正确方针是：", "options": [{"key": "A", "text": "统筹兼顾，全面安排"}, {"key": "B", "text": "既反保守又反冒进、在综合平衡中稳步前进"}, {"key": "C", "text": "团结互助，统筹兼顾"}, {"key": "D", "text": "具体问题具体分析"}], "answers": ["B"], "explanation": "党的八大提出经济建设的正确方针是「既反保守又反冒进、在综合平衡中稳步前进」。A项「统筹兼顾、全面安排」是处理人民内部矛盾的方针之一；C、D项不是党的八大经济建设方针的标准表述。教材对应「如何看待社会主义建设道路的初步探索（党的八大）」。", "source": "MZT概论教研室公众号"}, {"id": 141, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "多选", "question": "1956年起，MZD开始探索适合中国特点的社会主义建设道路。与此相联系，MZD提出了一系列新思想，主要有：", "options": [{"key": "A", "text": "强调独立自主地探索适合中国情况的社会主义建设道路"}, {"key": "B", "text": "提出以苏联为鉴"}, {"key": "C", "text": "提出马克思主义同中国实际的“第二次结合”"}, {"key": "D", "text": "强调改革开放"}], "answers": ["A", "B", "C"], "explanation": "1956年起MZD开始探索适合中国特点的社会主义建设道路，提出 A 独立自主地探索；B 以苏联为鉴；C 马克思主义同中国实际「第二次结合」。D项「改革开放」是DXP 1978年党的十一届三中全会以后提出的，不在 1956年起初步探索的范畴。教材对应「MZD作《论十大关系》报告的背景」。", "source": "MZT概论教研室公众号"}, {"id": 142, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "多选", "question": "关于社会主义现代化建设的积极因素表述正确的是：", "options": [{"key": "A", "text": "积极因素处于主导、统治地位"}, {"key": "B", "text": "是社会主义事业必定胜利的可靠保证"}, {"key": "C", "text": "积极因素与消极因素在一定条件下是可以互相转化的"}, {"key": "D", "text": "积极因素和消极因素是对立统一的关系"}], "answers": ["A", "B", "C", "D"], "explanation": "社会主义现代化建设的积极因素：A 处于主导、统治地位；B 是社会主义事业必定胜利的可靠保证；C 与消极因素在一定条件下可以互相转化；D 与消极因素是对立统一的关系。四项均符合「调动一切积极因素」方针的内在逻辑。教材对应「《论十大关系》的核心内容（调动一切积极因素）」。", "source": "MZT概论教研室公众号"}, {"id": 143, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "多选", "question": "中国共产党在探索中国建设道路过程中的理论成果有：", "options": [{"key": "A", "text": "MZD《论十大关系》的发表"}, {"key": "B", "text": "党在过渡时期总路线的制定"}, {"key": "C", "text": "中共“八大”制定的路线"}, {"key": "D", "text": "MZD《关于正确处理人民内部矛盾的问题》的重要讲话"}], "answers": ["A", "C", "D"], "explanation": "社会主义建设道路初步探索（1956年起）的理论成果：A《论十大关系》（探索良好开端）、C 中共八大制定的路线、D《关于正确处理人民内部矛盾的问题》。B项党在过渡时期总路线（1953）是过渡时期的总路线，属于社会主义改造阶段而不是「建设道路初步探索」的理论成果。教材对应「如何看待社会主义建设道路的初步探索」。", "source": "MZT概论教研室公众号"}, {"id": 144, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "多选", "question": "关于《论十大关系》的表述正确的有：", "options": [{"key": "A", "text": "它是新中国成立以来中央领导集体深入调查研究的成果"}, {"key": "B", "text": "它为中共八大的召开作了理论准备"}, {"key": "C", "text": "探讨了中央与地方的关系"}, {"key": "D", "text": "探讨了沿海工业和内地工业的关系"}], "answers": ["A", "B", "C", "D"], "explanation": "《论十大关系》：A 是新中国成立以来中央领导集体深入调查研究的成果（MZD听取 34 个部门汇报后形成）；B 为中共八大召开作了理论准备；C 探讨了中央与地方的关系；D 探讨了沿海工业和内地工业的关系。四项均正确。教材对应「《论十大关系》的核心内容」。", "source": "MZT概论教研室公众号"}, {"id": 145, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "多选", "question": "社会主义改造的任务完成以后，我国社会的基本矛盾是：", "options": [{"key": "A", "text": "敌我矛盾"}, {"key": "B", "text": "人民内部矛盾"}, {"key": "C", "text": "生产力和生产关系的矛盾"}, {"key": "D", "text": "经济基础和上层建筑的矛盾"}], "answers": ["C", "D"], "explanation": "社会主义改造完成后我国社会的基本矛盾是生产力和生产关系的矛盾（C）、经济基础和上层建筑的矛盾（D），这是社会主义社会仍然存在的基本矛盾。A、B项是按矛盾性质划分的两类不同矛盾，不是「基本矛盾」。教材对应「关于正确处理人民内部矛盾的问题」。", "source": "MZT概论教研室公众号"}, {"id": 146, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "多选", "question": "党的八大正确分析了社会主义改造完成后我国社会主要矛盾的变化，指出，社会主义制度在我国已经基本上建立起来了。我们国内的主要矛盾，已经是：", "options": [{"key": "A", "text": "人民日益增长的物质文化需要同落后的社会生产之间的矛盾"}, {"key": "B", "text": "人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾"}, {"key": "C", "text": "人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾"}, {"key": "D", "text": "无产阶级和资产阶级的矛盾"}], "answers": ["B", "C"], "explanation": "党的八大原文表述「我们国内的主要矛盾」是 B（建立先进工业国的要求同落后农业国的现实之间的矛盾）、C（经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾）。A项是十一届三中全会以后对主要矛盾的精炼表述（非党的八大原文）；D项错误，社会主义改造完成后无产阶级和资产阶级矛盾不再是主要矛盾。教材对应「如何看待社会主义建设道路的初步探索（党的八大对主要矛盾的判断）」。", "source": "MZT概论教研室公众号"}, {"id": 147, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "多选", "question": "关于社会主义两类不同性质的矛盾表述正确的有：", "options": [{"key": "A", "text": "反映在政治上可以划分为敌我矛盾和人民内部矛盾"}, {"key": "B", "text": "人民内部矛盾是非对抗性的矛盾，处理不当就转化为对抗性的矛盾"}, {"key": "C", "text": "用专政、说服教育的方法解决敌我矛盾"}, {"key": "D", "text": "人民同反抗社会主义革命的社会势力和社会集团的矛盾属于人民内部矛盾"}], "answers": ["A", "B"], "explanation": "两类不同性质矛盾：A 反映在政治上可以划分为敌我矛盾和人民内部矛盾；B 人民内部矛盾是非对抗性的，处理不当可以转化为对抗性的。C项错误：专政方法用于解决敌我矛盾，说服教育用于解决人民内部矛盾——两种方法对应两种不同矛盾，不能混用；D项错误：人民同反抗社会主义革命的社会势力和社会集团之间是敌我矛盾，不是人民内部矛盾。教材对应「关于正确处理人民内部矛盾的问题」。", "source": "MZT概论教研室公众号"}, {"id": 148, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "多选", "question": "MZD在《论十大关系》中指出，正确处理人民内部矛盾的方针、原则包括：", "options": [{"key": "A", "text": "“团结—批评—团结”"}, {"key": "B", "text": "实行统筹兼顾、适当安排的方针"}, {"key": "C", "text": "“百花齐放、百家争鸣”"}, {"key": "D", "text": "“长期共存，互相监督”"}], "answers": ["A", "B", "C", "D"], "explanation": "处理人民内部矛盾的方针、原则有四项：A 总公式「团结—批评—团结」；B 经济工作上「统筹兼顾、适当安排」；C 科学文化领域「百花齐放、百家争鸣」；D 党际关系上「长期共存、互相监督」。四项均符合题意。教材对应「关于正确处理人民内部矛盾的问题（正确处理人民内部矛盾的方针、原则）」。", "source": "MZT概论教研室公众号"}, {"id": 149, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "多选", "question": "MZD提出的社会主义现代化建设“两步走”的发展战略是：", "options": [{"key": "A", "text": "第一步建成一个独立的比较完整的工业体系和国民经济体系"}, {"key": "B", "text": "第一步使中国逐步由农业国转变为工业国"}, {"key": "C", "text": "第二步全面实现工业、农业、国防和科学技术现代化，使中国走在世界前列"}, {"key": "D", "text": "第二步到本世纪末全面实现现代化，人民生活达到小康水平"}], "answers": ["A", "C"], "explanation": "MZD提出社会主义现代化建设「两步走」战略：A 第一步建成独立的比较完整的工业体系和国民经济体系；C 第二步全面实现工业、农业、国防、科技四个现代化、使中国走在世界前列。B、D项不是MZD「两步走」的标准表述（D项的「小康水平」是DXP时期「三步走」中的提法）。教材对应「MZD、周恩来等领导同志对走中国工业化道路的思考」。", "source": "MZT概论教研室公众号"}, {"id": 150, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "多选", "question": "我党在社会主义建设道路初步探索中提出的重要思想理论观点包括：", "options": [{"key": "A", "text": "社会主义发展两阶段理论"}, {"key": "B", "text": "社会主义现代化建设“两步走”发展战略"}, {"key": "C", "text": "资本主义经济是社会主义经济的有益补充"}, {"key": "D", "text": "要建立适合我国情况和人民需要的社会主义的市场"}], "answers": ["A", "B", "C", "D"], "explanation": "初步探索提出的重要思想理论观点：A 社会主义发展两阶段理论（不发达的社会主义和比较发达的社会主义）；B 社会主义现代化建设「两步走」发展战略；C 资本主义经济是社会主义经济的有益补充（陈云相关思想）；D 要建立适合我国情况和人民需要的社会主义的市场。四项均属重要观点。教材对应「初步探索的意义及经验教训（重要思想理论观点）」。", "source": "MZT概论教研室公众号"}, {"id": 151, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "多选", "question": "20世纪50年代末60，我党关于经济体制的认识表述正确的包括：", "options": [{"key": "A", "text": "发展商品生产，利用价值规律"}, {"key": "B", "text": "社会主义经济应既有计划又有多样性和灵活性"}, {"key": "C", "text": "初步建立社会主义市场经济体制"}, {"key": "D", "text": "建立适合我国情况和人民需要的社会主义的市场"}], "answers": ["A", "B", "D"], "explanation": "20世纪 50年代末 60年代党关于经济体制的探索性认识：A 发展商品生产、利用价值规律；B 社会主义经济应既有计划又有多样性和灵活性；D 建立适合我国情况和人民需要的社会主义的市场。C项错误：「初步建立社会主义市场经济体制」是 1990年代党的十四大以后的事，不属于 50年代末 60年代的认识范畴。教材对应「初步探索的意义及经验教训（经济体制认识）」。", "source": "MZT概论教研室公众号"}, {"id": 152, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "多选", "question": "中共八大指出进一步加强社会主义民主政治建设必须做到：", "options": [{"key": "A", "text": "加强党对国家机关的领导和监督"}, {"key": "B", "text": "系统地制定比较完备的法律，健全发展"}, {"key": "C", "text": "团结一切可以团结的力量，把当前的注意力转到社会主义建设上来"}, {"key": "D", "text": "加强民主集中制"}], "answers": ["A", "B", "D"], "explanation": "中共八大在“进一步加强社会主义民主政治建设”这一层面强调的是 A 加强党对国家机关的领导和监督、B 系统地制定比较完备的法律、D 加强民主集中制。C项“团结一切可以团结的力量，把当前的注意力转到社会主义建设上来”确实是八大时期的重要政治口号，但它说的是全党全国工作重心和团结任务的总体方针，不是民主政治建设这一小问下列出的制度建设要求，所以本题不选 C。教材对应「如何看待社会主义建设道路的初步探索（党的八大民主政治建设要求）」。", "source": "MZT概论教研室公众号"}, {"id": 153, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "多选", "question": "MZD关于社会主义发展阶段的观点表述正确的是：", "options": [{"key": "A", "text": "第一个阶段是不发达的社会主义"}, {"key": "B", "text": "第二个阶段是比较发达的社会主义"}, {"key": "C", "text": "不发达的社会主义比比较发达的社会主义需要更长的时间"}, {"key": "D", "text": "第二个阶段是相对发达的社会主义"}], "answers": ["A", "B"], "explanation": "MZD把社会主义分为两个阶段：A 第一个阶段是不发达的社会主义；B 第二个阶段是比较发达的社会主义。C项虽与历史事实相符但不是MZD对该阶段时间长短的明确判断（题干「表述正确的是」侧重命题成立）；D项错误，MZD用的提法是「比较发达的社会主义」而非「相对发达」。教材对应「初步探索的意义及经验教训（MZD社会主义发展阶段理论）」。", "source": "MZT概论教研室公众号"}, {"id": 154, "chapter": "第4章 社会主义建设道路初步探索的理论成果", "type": "多选", "question": "党领导人民探索社会主义建设道路，历经艰辛和曲折，在理论和实践上取得了一系列重要成果。这些成果具有重要意义：", "options": [{"key": "A", "text": "巩固和发展了我国的社会主义制度"}, {"key": "B", "text": "为开创中国特色社会主义提供了宝贵经验、理论准备、物质基础"}, {"key": "C", "text": "丰富了科学社会主义的理论和实践"}, {"key": "D", "text": "为其他国家的社会主义建设提供了经验和借鉴"}], "answers": ["A", "B", "C", "D"], "explanation": "资料库简答题概括初步探索的意义：A 巩固和发展了我国的社会主义制度；B 为开创中国特色社会主义提供了宝贵经验、理论准备、物质基础；C 丰富了科学社会主义的理论和实践。再加 D 为其他国家的社会主义建设提供了经验和借鉴，四项均是初步探索的重大意义。教材对应「初步探索的意义及经验教训」。", "source": "MZT概论教研室公众号"}, {"id": 155, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "单选", "question": "XJP新时代中国特色社会主义思想的核心要义是（）", "options": [{"key": "A", "text": "推进马克思主义中国化时代化"}, {"key": "B", "text": "坚持以经济建设为中心"}, {"key": "C", "text": "坚持和发展中国特色社会主义"}, {"key": "D", "text": "实现社会主义现代化"}], "answers": ["C"], "explanation": "XJP新时代中国特色社会主义思想的核心要义是坚持和发展中国特色社会主义。A项推进马克思主义中国化时代化是其历史使命；B项以经济建设为中心是党的基本路线核心；D项实现社会主义现代化是奋斗目标，均不是「核心要义」。教材对应「中国特色社会主义理论体系形成发展」。", "source": "MZT概论教研室公众号"}, {"id": 156, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "单选", "question": "中国特色社会主义进入新时代，我国社会主要矛盾已经转化为（）", "options": [{"key": "A", "text": "人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾"}, {"key": "B", "text": "人民日益增长的物质文化需要同落后的社会生产之间的矛盾"}, {"key": "C", "text": "人民对于建立先进的工业国的要求同落后的农业国的现实之间的矛盾"}, {"key": "D", "text": "人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾"}], "answers": ["A"], "explanation": "党的十九大指出，中国特色社会主义进入新时代，我国社会主要矛盾已经转化为「人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾」。B项是改革开放至党的十九大前主要矛盾的精炼表述；C、D项是党的八大对主要矛盾的判断表述。教材对应「中国特色社会主义理论体系形成发展（新时代主要矛盾）」。", "source": "MZT概论教研室公众号"}, {"id": 157, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "单选", "question": "中国特色社会主义进入新时代，时代主题仍然是（）", "options": [{"key": "A", "text": "战争与革命问题"}, {"key": "B", "text": "和平与发展问题"}, {"key": "C", "text": "协调与平衡问题"}, {"key": "D", "text": "公平与正义问题"}], "answers": ["B"], "explanation": "中国特色社会主义进入新时代，时代主题仍然是和平与发展问题——这是DXP作出的科学判断，至今仍是判断国际形势的基本立足点。A项「战争与革命」是 20世纪上半叶的时代主题；C、D项不是党对时代主题的标准表述。教材对应「中国特色社会主义理论体系形成发展的国际背景」。", "source": "MZT概论教研室公众号"}, {"id": 158, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "单选", "question": "在DXP看来，建设中国特色社会主义，关键在于（）", "options": [{"key": "A", "text": "坚持.加强和改善党的领导"}, {"key": "B", "text": "坚持四项基本原则"}, {"key": "C", "text": "坚持改革开放"}, {"key": "D", "text": "坚持以经济建设为中心"}], "answers": ["A"], "explanation": "DXP始终强调建设中国特色社会主义关键在于坚持、加强和改善党的领导。B项四项基本原则、C项改革开放、D项以经济建设为中心是党的基本路线的具体内容（一个中心、两个基本点），都是在党的领导这一关键前提下展开的。教材对应「中国特色社会主义理论体系形成发展的历史条件」。", "source": "MZT概论教研室公众号"}, {"id": 159, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "单选", "question": "中国特色社会主义理论体系的开篇之作是（）", "options": [{"key": "A", "text": "MZD思想"}, {"key": "B", "text": "DXP理论"}, {"key": "C", "text": "“三个代表”重要思想"}, {"key": "D", "text": "科学发展观"}], "answers": ["B"], "explanation": "选项里的几位人物都重要，坑在把贡献归属串错；本题只认「开篇之作」这件事的准确归属。DXP理论是中国特色社会主义理论体系的开篇之作，开辟了中国特色社会主义道路。A项MZD思想是马克思主义中国化第一次飞跃的成果，不属于中国特色社会主义理论体系；C、D项是中国特色社会主义理论体系的重要组成部分，但不是「开篇之作」。教材对应「中国特色社会主义理论体系形成发展」。", "source": "MZT概论教研室公众号"}, {"id": 160, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "单选", "question": "XJP新时代中国特色社会主义思想明确中国特色社会主义制度的最大优势是（）", "options": [{"key": "A", "text": "以人民为中心"}, {"key": "B", "text": "中国共产党领导"}, {"key": "C", "text": "坚持社会主义核心价值体系"}, {"key": "D", "text": "人民当家作主"}], "answers": ["B"], "explanation": "XJP新时代中国特色社会主义思想明确，中国共产党领导是中国特色社会主义最本质的特征、是中国特色社会主义制度的最大优势。A、C、D项是中国特色社会主义的重要原则和内容，但「最大优势」是党的领导。教材对应「中国特色社会主义理论体系形成发展（XJP新时代中国特色社会主义思想）」。", "source": "MZT概论教研室公众号"}, {"id": 161, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "单选", "question": "中国特色社会主义的本质要求和重要保障是（）", "options": [{"key": "A", "text": "全面建设社会主义现代化国家"}, {"key": "B", "text": "全面依法治国"}, {"key": "C", "text": "全面深化改革"}, {"key": "D", "text": "全面从严治党"}], "answers": ["B"], "explanation": "全面依法治国是中国特色社会主义的本质要求和重要保障，是「四个全面」战略布局中的重要组成部分。A项是奋斗目标；C项是动力机制；D项是政治保障，但表述为「本质要求和重要保障」的是全面依法治国。教材对应「中国特色社会主义理论体系形成发展」。", "source": "MZT概论教研室公众号"}, {"id": 162, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "单选", "question": "中国特色社会主义理论体系的核心主题是（）", "options": [{"key": "A", "text": "改革"}, {"key": "B", "text": "开放"}, {"key": "C", "text": "发展"}, {"key": "D", "text": "建设"}], "answers": ["C"], "explanation": "发展是中国特色社会主义理论体系的核心主题——「发展是硬道理」「发展是党执政兴国的第一要务」。A项改革、B项开放、D项建设都是发展的手段或具体方面，不是「核心主题」。教材对应「中国特色社会主义理论体系形成发展」。", "source": "MZT概论教研室公众号"}, {"id": 163, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "单选", "question": "建设有中国特色社会主义首要的基本理论问题是（）", "options": [{"key": "A", "text": "解放思想，实事求是"}, {"key": "B", "text": "什么是社会主义，怎样建设社会主义"}, {"key": "C", "text": "一个中心，两个基本点"}, {"key": "D", "text": "正确处理改革.发展.稳定的关系"}], "answers": ["B"], "explanation": "「什么是社会主义、怎样建设社会主义」是DXP理论也是中国特色社会主义理论体系首要的基本理论问题。A项是思想路线；C项是基本路线核心内容；D项是改革开放重要原则，均不是「首要的基本理论问题」。教材对应「中国特色社会主义理论体系形成发展」。", "source": "MZT概论教研室公众号"}, {"id": 164, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "单选", "question": "（）是中国特色社会主义的本质属性。", "options": [{"key": "A", "text": "科学发展"}, {"key": "B", "text": "公平正义"}, {"key": "C", "text": "社会和谐"}, {"key": "D", "text": "自由民主"}], "answers": ["C"], "explanation": "社会和谐是中国特色社会主义的本质属性——党的十六届六中全会明确提出此论断。A项科学发展是发展观；B项公平正义是社会建设的核心价值取向；D项自由民主是社会主义核心价值观的元素，均不是「本质属性」。教材对应「中国特色社会主义理论体系形成发展」。", "source": "MZT概论教研室公众号"}, {"id": 165, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "单选", "question": "中国共产党第十九次全国代表大会，是在全面建成小康社会（）阶段.中国特色社会主义进入新时代的关键时期召开的一次十分重要的大会。", "options": [{"key": "A", "text": "新的"}, {"key": "B", "text": "决胜"}, {"key": "C", "text": "关键"}, {"key": "D", "text": "重要"}], "answers": ["B"], "explanation": "党的十九大原文：「中国共产党第十九次全国代表大会，是在全面建成小康社会决胜阶段、中国特色社会主义进入新时代的关键时期召开的一次十分重要的大会。」A、C、D项不符合党的十九大原文表述。教材对应「中国特色社会主义理论体系形成发展（党的十九大背景）」。", "source": "MZT概论教研室公众号"}, {"id": 166, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "单选", "question": "经过长期努力，中国特色社会主义进入了新时代，这是我国发展新的（）", "options": [{"key": "A", "text": "历史时期"}, {"key": "B", "text": "历史方位"}, {"key": "C", "text": "历史阶段"}, {"key": "D", "text": "历史特点"}], "answers": ["B"], "explanation": "党的十九大报告明确：经过长期努力，中国特色社会主义进入了新时代，这是我国发展新的「历史方位」。A、C、D项不是党的十九大原文表述（特指「历史方位」，强调中国所处坐标位置的新定位）。教材对应「中国特色社会主义理论体系形成发展」。", "source": "MZT概论教研室公众号"}, {"id": 167, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "多选", "question": "中国特色社会主义进入新时代，我国社会主要矛盾应转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。但是，我国社会主要矛盾的变化没有改变我国对我国社会主义所处历史阶段的判断，依据是（）", "options": [{"key": "A", "text": "我国仍然是世界上最大的发展中国国家"}, {"key": "B", "text": "我国仍然面临极其复杂的国际环境"}, {"key": "C", "text": "我国总体上仍处于不发达阶段"}, {"key": "D", "text": "我国社会主要矛盾的变化只是社会主义初级阶段这个历史阶段中的变化"}], "answers": ["A", "C", "D"], "explanation": "主要矛盾变化没有改变社会主义初级阶段历史阶段判断的依据：A 我国仍然是世界上最大的发展中国家；C 我国总体上仍处于不发达阶段；D 主要矛盾变化只是社会主义初级阶段这个历史阶段中的变化。B项「面临复杂国际环境」是外部因素，不构成判断我国社会主义所处历史阶段的依据。教材对应「中国特色社会主义理论体系形成发展（新时代主要矛盾与历史阶段判断）」。", "source": "MZT概论教研室公众号"}, {"id": 168, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "多选", "question": "XJP新时代中国特色社会主义思想（）", "options": [{"key": "A", "text": "开辟了马克思主义新境界"}, {"key": "B", "text": "是新时代党和人民共同奋斗的精神旗帜"}, {"key": "C", "text": "是实现中华民族伟大复兴的行动指南"}, {"key": "D", "text": "是中国精神的时代精华"}], "answers": ["A", "B", "C", "D"], "explanation": "XJP新时代中国特色社会主义思想：A 开辟了马克思主义新境界；B 是新时代党和人民共同奋斗的精神旗帜；C 是实现中华民族伟大复兴的行动指南；D 是中国精神的时代精华。四项均符合党对其历史地位的论述。教材对应「中国特色社会主义理论体系形成发展（XJP新时代中国特色社会主义思想的地位）」。", "source": "MZT概论教研室公众号"}, {"id": 169, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "多选", "question": "中国特色社会主义进入新时代的依据是（）", "options": [{"key": "A", "text": "改革开放以来特别是党的十八大以来我国取得的历史性成就和发生的历史性变革"}, {"key": "B", "text": "我国社会主要矛盾的转化"}, {"key": "C", "text": "世界正经历百年未有之大变局"}, {"key": "D", "text": "中华民族伟大复兴正处于关键时期"}], "answers": ["A", "B"], "explanation": "「进入新时代」的依据：A 改革开放以来特别是党的十八大以来我国取得的历史性成就和发生的历史性变革（必然结果）；B 我国社会主要矛盾的转化（必然结果）。C、D项是新时代的国际国内背景，但作为「进入新时代的依据」的核心表述是 A 和 B。教材对应「中国特色社会主义理论体系形成发展（中国特色社会主义进入新时代的依据）」。", "source": "MZT概论教研室公众号"}, {"id": 170, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "多选", "question": "XJP新时代中国特色社会主义思想的理论特质包括（）", "options": [{"key": "A", "text": "秉持人民至上.彰显历史自觉"}, {"key": "B", "text": "坚持解放思想.扩大改革开放"}, {"key": "C", "text": "坚持实事求是.突出问题导向"}, {"key": "D", "text": "强化战略思维.发扬斗争精神"}], "answers": ["A", "C", "D"], "explanation": "理论特质：A 秉持人民至上、彰显历史自觉；C 坚持实事求是、突出问题导向；D 强化战略思维、发扬斗争精神。B项「坚持解放思想、扩大改革开放」是改革开放总体方针的表述，不是该思想的「理论特质」标准提法。教材对应「中国特色社会主义理论体系形成发展（XJP新时代中国特色社会主义思想的理论特质）」。", "source": "MZT概论教研室公众号"}, {"id": 171, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "多选", "question": "新时代中国共产党的历史使命，就是统揽（），在全面建成小康社会的基础上全面建成社会主义现代化强国,实现中华民族伟大复兴的中国梦。", "options": [{"key": "A", "text": "伟大斗争"}, {"key": "B", "text": "伟大工程"}, {"key": "C", "text": "伟大事业"}, {"key": "D", "text": "伟大梦想"}], "answers": ["A", "B", "C", "D"], "explanation": "新时代党的历史使命是统揽伟大斗争（A）、伟大工程（B，党的建设新的伟大工程）、伟大事业（C，中国特色社会主义事业）、伟大梦想（D，中华民族伟大复兴的中国梦），简称「四个伟大」。四项均符合题意。教材对应「中国特色社会主义理论体系形成发展（党的十九大「四个伟大」）」。", "source": "MZT概论教研室公众号"}, {"id": 172, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "多选", "question": "党的十九大的主题是：不忘初心，牢记使命（）。", "options": [{"key": "A", "text": "高举中国特色社会主义伟大旗帜"}, {"key": "B", "text": "决胜全面建成小康社会"}, {"key": "C", "text": "夺取新时代中国特色社会主义伟大胜利"}, {"key": "D", "text": "为实现中华民族伟大复兴的中国梦不懈奋斗"}], "answers": ["A", "B", "C", "D"], "explanation": "党的十九大主题原文：「不忘初心，牢记使命，高举中国特色社会主义伟大旗帜，决胜全面建成小康社会，夺取新时代中国特色社会主义伟大胜利，为实现中华民族伟大复兴的中国梦不懈奋斗。」四项均是党的十九大主题的组成部分。教材对应「中国特色社会主义理论体系形成发展（党的十九大主题）」。", "source": "MZT概论教研室公众号"}, {"id": 173, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "多选", "question": "中国特色社会主义进入新时代，意味着中国特色社会主义（）不断发展，拓展了发展中国家走向现代化的途径，给世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供了全新选择，为解决人类问题贡献了中国智慧和中国方案。", "options": [{"key": "A", "text": "道路"}, {"key": "B", "text": "理论"}, {"key": "C", "text": "制度"}, {"key": "D", "text": "文化"}], "answers": ["A", "B", "C", "D"], "explanation": "党的十九大原文指出：中国特色社会主义进入新时代意味着中国特色社会主义道路、理论、制度、文化不断发展，拓展了发展中国家走向现代化的途径。四项即「四个自信」的对象，构成中国特色社会主义的整体表达。教材对应「中国特色社会主义理论体系形成发展（新时代的世界意义）」。", "source": "MZT概论教研室公众号"}, {"id": 174, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "多选", "question": "XJP新时代中国特色社会主义思想是当代中国马克思主义、21世纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主义中国化新的飞跃。XJP新时代中国特色社会主义思想创立的社会历史条件是（）", "options": [{"key": "A", "text": "中国特色社会主义进入新时代"}, {"key": "B", "text": "世界正经历百年未有之大变局"}, {"key": "C", "text": "中华民族伟大复兴正处于关键时期"}, {"key": "D", "text": "中国全面建成了小康社会"}], "answers": ["A", "B", "C"], "explanation": "社会历史条件包括 A 中国特色社会主义进入新时代、B 世界正经历百年未有之大变局、C 中华民族伟大复兴正处于关键时期。D项「全面建成小康社会」是 2020年党的十九届五中全会宣告完成的目标，思想创立（2017年党的十九大）时「全面建成小康社会」尚未完成，故不属于该思想创立的社会历史条件。教材对应「中国特色社会主义理论体系形成发展（XJP新时代中国特色社会主义思想创立的社会历史条件）」。", "source": "MZT概论教研室公众号"}, {"id": 175, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "多选", "question": "经过长期努力，中国特色社会主义进入了新时代，这是我国发展新的历史方位。中国特色社会主义进入了新时代有着充分的依据，它是（）", "options": [{"key": "A", "text": "改革开放以来特别是党的十八大以来我国取得的历史性成就和发生的历史性变革的必然结果"}, {"key": "B", "text": "我国社会主要矛盾转化的必然结果"}, {"key": "C", "text": "历史性地解决了绝对贫困问题的必然结果"}, {"key": "D", "text": "全面建成了小康社会的必然结果"}], "answers": ["A", "B"], "explanation": "新时代依据：A 改革开放以来特别是党的十八大以来我国取得历史性成就和历史性变革的必然结果；B 我国社会主要矛盾转化的必然结果。C项「解决绝对贫困」和D项「全面建成小康社会」是 2020年才取得的成就，党的十九大（2017）确立新时代的依据时尚未完成，故不在 2017年宣布「进入新时代」的依据范围内。教材对应「中国特色社会主义理论体系形成发展（新时代的依据）」。", "source": "MZT概论教研室公众号"}, {"id": 176, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "多选", "question": "党的十九大报告指出，经过长期努力，中国特色社会主义进人了新时代，这是我国发展新的历史方位。这个新时代，是承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代，是（）", "options": [{"key": "A", "text": "决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代"}, {"key": "B", "text": "全国各族人民团结奋斗、不断创造美好生活.逐步实现全体人民共同富裕的时代"}, {"key": "C", "text": "全体中华儿女勤力同心、奋力实现中华民族伟大复兴中国梦的时代"}, {"key": "D", "text": "我国日益走近世界舞台中央、不断为人类做出更大贡献的时代"}], "answers": ["A", "B", "C", "D"], "explanation": "党的十九大报告对新时代的内涵作了「五个是」的描述，本题列出了其中四个层次：A 决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代；B 全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代；C 中华儿女戮力同心、奋力实现中华民族伟大复兴中国梦的时代；D 我国日益走近世界舞台中央、不断为人类做出更大贡献的时代。四项均符合党的十九大报告原文。教材对应「中国特色社会主义理论体系形成发展（新时代的内涵）」。", "source": "MZT概论教研室公众号"}, {"id": 177, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "多选", "question": "经过长期努力，中国特色社会主义进入了新时代，这是我国发展新的历史方位。中国特色社会主义进入新时代，意味着中国特色社会主义道路.理论.制度.文化不断发展，拓展了发展中国家走向现代化的途径，给世界上那些既希望加快发展又希望保持自身独立性的国家和民族提供了全新选择，为解决人类问题贡献了中国智慧和中国方案。还意味着（）", "options": [{"key": "A", "text": "近代以来久经磨难的中华民族迎来了从站起来.富起来到强起来的伟大飞跃"}, {"key": "B", "text": "迎来了实现中华民族伟大复兴的光明前景"}, {"key": "C", "text": "科学社会主义在21世纪的中国焕发出强大生机活力"}, {"key": "D", "text": "在世界上高高举起了中国特色社会主义伟大旗帜"}], "answers": ["A", "B", "C", "D"], "explanation": "「中国特色社会主义进入新时代」意味着：A 中华民族迎来了从站起来、富起来到强起来的伟大飞跃；B 迎来了实现中华民族伟大复兴的光明前景；C 科学社会主义在 21 世纪的中国焕发出强大生机活力；D 在世界上高高举起了中国特色社会主义伟大旗帜。四项均符合党的十九大对「进入新时代」重大意义的论述。教材对应「中国特色社会主义理论体系形成发展（新时代「三个意味着」的深化）」。", "source": "MZT概论教研室公众号"}, {"id": 178, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "多选", "question": "XJP同志为主要代表的中国共产党人，坚持把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，坚持MZD思想、DXP理论、“三个代表”重要思想、科学发展观，深刻总结并充分运用党成立以来的历史经验，从新的实际出发，创立了XJP新时代中国特色社会主义思想。XJP新时代中国特色社会主义思想（）", "options": [{"key": "A", "text": "是当代中国马克思主义"}, {"key": "B", "text": "是中华文化和中国精神的时代精华"}, {"key": "C", "text": "实现了马克思主义中国化新的飞跃"}, {"key": "D", "text": "是21世纪马克思主义"}], "answers": ["A", "B", "C", "D"], "explanation": "XJP新时代中国特色社会主义思想：A 是当代中国马克思主义；B 是中华文化和中国精神的时代精华；C 实现了马克思主义中国化新的飞跃；D 是 21 世纪马克思主义。四项均是党的十九届六中全会等文献对其历史地位的明确论断。教材对应「中国特色社会主义理论体系形成发展（XJP新时代中国特色社会主义思想的理论地位）」。", "source": "MZT概论教研室公众号"}, {"id": 179, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "多选", "question": "XJP新时代中国特色社会主义思想科学回答的重大时代课题是", "options": [{"key": "A", "text": "坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义"}, {"key": "B", "text": "实现什么样的发展、怎样发展"}, {"key": "C", "text": "建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国"}, {"key": "D", "text": "建设什么样的长期执政的马克思主义政党，怎样建设长期执政的马克思主义政党"}], "answers": ["A", "C", "D"], "explanation": "重大时代课题：A 坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义；C 建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国；D 建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党。B项「实现什么样的发展、怎样发展」是科学发展观回答的时代课题，不是XJP新时代中国特色社会主义思想的核心命题。教材对应「中国特色社会主义理论体系形成发展（XJP新时代中国特色社会主义思想回答的重大时代课题）」。", "source": "MZT概论教研室公众号"}, {"id": 180, "chapter": "第5章 中国特色社会主义理论体系的形成与发展", "type": "多选", "question": "XJP新时代中国特色社会主义思想是当代中国马克思主义、21世纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主义中国化新的飞跃。这一重大论断（）", "options": [{"key": "A", "text": "科学阐明了XJP新时代中国特色社会主义思想的理论内涵和重大意义"}, {"key": "B", "text": "贯通了中国共产党百年奋斗的历史逻辑、理论逻辑、实践逻辑"}, {"key": "C", "text": "表明了XJP新时代中国特色社会主义思想在马克思主义发展史上的重要地位"}, {"key": "D", "text": "表明了XJP新时代中国特色社会主义思想在中华文明发展史上的重要地位"}], "answers": ["A", "C", "D"], "explanation": "这一重大论断：A 科学阐明了该思想的理论内涵和重大意义；C 表明了该思想在马克思主义发展史上的重要地位；D 表明了该思想在中华文明发展史上的重要地位。B项「贯通中国共产党百年奋斗的历史逻辑、理论逻辑、实践逻辑」侧重党百年奋斗历史经验的总结表述，不是本论断的主要含义。教材对应「中国特色社会主义理论体系形成发展（XJP新时代中国特色社会主义思想的重大论断意义）」。", "source": "MZT概论教研室公众号"}, {"id": 181, "chapter": "第6章 DXP理论", "type": "单选", "question": "搞清楚“什么是社会主义，怎样建设社会主义”，关键在于（）", "options": [{"key": "A", "text": "在坚持社会主义基本制度的基础上进一步认清社会主义的本质"}, {"key": "B", "text": "首先弄清楚中国所处的历史方位"}, {"key": "C", "text": "了解当前时代的主题"}, {"key": "D", "text": "坚持解放思想、实事求是的思想路线"}], "answers": ["A"], "explanation": "搞清楚「什么是社会主义、怎样建设社会主义」，关键在于在坚持社会主义基本制度的基础上进一步认清社会主义的本质。B、C项是其他维度的认识；D项是思想方法（即怎么搞清楚），不是「关键」内容本身。教材对应「DXP理论回答的基本问题；社会主义本质理论」。", "source": "MZT概论教研室公众号"}, {"id": 182, "chapter": "第6章 DXP理论", "type": "单选", "question": "DXP认为，社会主义经济政策对不对，归根到底要看（）", "options": [{"key": "A", "text": "公有化程度是否让人满意"}, {"key": "B", "text": "工业化程度是否达到发达国家标准"}, {"key": "C", "text": "生产力是否发展，人民收入是否增加"}, {"key": "D", "text": "收入分配是否公正合理"}], "answers": ["C"], "explanation": "DXP认为社会主义经济政策对不对，归根到底要看生产力是否发展、人民收入是否增加——这就是判断政策的根本标准（也是「三个有利于」标准的核心）。A、B、D项虽是相关考量，但归根到底的衡量标准是生产力发展与人民生活水平。教材对应「社会主义本质理论；社会主义根本任务的理论」。", "source": "MZT概论教研室公众号"}, {"id": 183, "chapter": "第6章 DXP理论", "type": "单选", "question": "DXP对社会主义本质作出总结性的理论概括是在（）", "options": [{"key": "A", "text": "十一届三中全会"}, {"key": "B", "text": "十三届四中全会"}, {"key": "C", "text": "在全国科学大会上的讲话"}, {"key": "D", "text": "南方谈话"}], "answers": ["D"], "explanation": "1992年DXP在南方谈话中作出总结性概括：「社会主义的本质，是解放生产力、发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。」A、B、C项时间均早于该总结性概括的提出。教材对应「社会主义本质理论」。", "source": "MZT概论教研室公众号"}, {"id": 184, "chapter": "第6章 DXP理论", "type": "单选", "question": "中国社会主义改革开放和现代化建设的总设计师是：（）", "options": [{"key": "A", "text": "MZD"}, {"key": "B", "text": "DXP"}, {"key": "C", "text": "HJT"}, {"key": "D", "text": "李瑞环"}], "answers": ["B"], "explanation": "选项里的几位人物都重要，坑在把贡献归属串错；本题只认「总设计师」这件事的准确归属。DXP是中国社会主义改革开放和现代化建设的总设计师——他规划和指导了从十一届三中全会到 1990年代的改革开放进程和发展战略。A、C、D 三位虽都是党的重要领导人，但被党中央和史学界正式称为「总设计师」的是DXP。教材对应「DXP理论的历史地位」。", "source": "MZT概论教研室公众号"}, {"id": 185, "chapter": "第6章 DXP理论", "type": "单选", "question": "“DXP同志留给我们的最重要的思想和政治遗产，就是：（）", "options": [{"key": "A", "text": "他带领党和人民开创的中国特色社会主义，就是他创立的DXP理论。"}, {"key": "B", "text": "一国两制的伟大构想与成功实践"}, {"key": "C", "text": "对当今时代背景的科学把握与概括"}, {"key": "D", "text": "《DXP文选》"}], "answers": ["A"], "explanation": "这题问的是DXP最重要思想和政治遗产的完整表述，不是问某个具体政策或著作。DXP同志留给我们的最重要遗产，就是他带领党和人民开创的中国特色社会主义和创立的DXP理论。B项「一国两制」是DXP理论的重要组成部分，但不是完整遗产表述；C项时代背景概括、D项《DXP文选》都低于这个总括层级。教材对应「DXP理论的历史地位」。", "source": "MZT概论教研室公众号"}, {"id": 186, "chapter": "第6章 DXP理论", "type": "单选", "question": "党十二届三中全会提出了社会主义经济是：（）", "options": [{"key": "A", "text": "社会主义计划经济"}, {"key": "B", "text": "有计划的商品经济"}, {"key": "C", "text": "社会主义市场经济"}, {"key": "D", "text": "自由市场经济"}], "answers": ["B"], "explanation": "1984年党的十二届三中全会通过《中共中央关于经济体制改革的决定》，提出社会主义经济是公有制基础上的有计划的商品经济——是从传统计划经济迈向社会主义市场经济的关键过渡性提法。A项是传统提法；C项是党的十四大才正式确立的目标；D项不是党的提法。教材对应「社会主义市场经济理论」。", "source": "MZT概论教研室公众号"}, {"id": 187, "chapter": "第6章 DXP理论", "type": "单选", "question": "DXP理论轮廓的形成标志是：（）", "options": [{"key": "A", "text": "党十一届三中全会公报"}, {"key": "B", "text": "党的十三大报告"}, {"key": "C", "text": "党十五大报告"}, {"key": "D", "text": "南方谈话"}], "answers": ["B"], "explanation": "1987年党的十三大系统阐述了社会主义初级阶段理论和党在社会主义初级阶段的基本路线，第一次比较系统地阐述了DXP理论的轮廓，标志着DXP理论轮廓的形成。A项十一届三中全会是改革开放起点；C项十五大是把DXP理论确立为党的指导思想；D项南方谈话是DXP理论走向成熟的标志。教材对应「DXP理论的历史地位」。", "source": "MZT概论教研室公众号"}, {"id": 188, "chapter": "第6章 DXP理论", "type": "单选", "question": "DXP正式提出“建设有中国特色的社会主义”科学命题是在：（）", "options": [{"key": "A", "text": "党的十一届三中全会上"}, {"key": "B", "text": "党的十一届六中全会上"}, {"key": "C", "text": "党的十二大上"}, {"key": "D", "text": "党的十三大上"}], "answers": ["C"], "explanation": "1982年党的十二大开幕词中，DXP正式提出「建设有中国特色的社会主义」科学命题，标志着党对中国社会主义建设道路的探索进入新阶段。A项是改革开放起点（1978）；B项十一届六中全会主要通过《关于建国以来党的若干历史问题的决议》；D项十三大系统阐述DXP理论的初步轮廓。教材对应「DXP理论的历史地位」。", "source": "MZT概论教研室公众号"}, {"id": 189, "chapter": "第6章 DXP理论", "type": "单选", "question": "把DXP理论确立为党的指导思想是在：（）", "options": [{"key": "A", "text": "党的十三大上"}, {"key": "B", "text": "党的十四大上"}, {"key": "C", "text": "党的十五大上"}, {"key": "D", "text": "党的十六大上"}], "answers": ["C"], "explanation": "1997年党的十五大把DXP理论确立为党的指导思想并写入党章。A项十三大系统阐述DXP理论轮廓；B项十四大正式提出建立社会主义市场经济体制；D项十六大把「三个代表」重要思想写入党章。教材对应「DXP理论的历史地位」。", "source": "MZT概论教研室公众号"}, {"id": 190, "chapter": "第6章 DXP理论", "type": "单选", "question": "DXP理论首要的基本理论问题是：（）", "options": [{"key": "A", "text": "社会主义的根本任务问题"}, {"key": "B", "text": "社会主义的发展阶段问题"}, {"key": "C", "text": "社会主义的发展动力问题"}, {"key": "D", "text": "什么是社会主义，怎样建设社会主义的问题"}], "answers": ["D"], "explanation": "「什么是社会主义、怎样建设社会主义」是DXP理论首要的基本理论问题。A、B、C项都是DXP理论涵盖的重要问题，但都从属于首要的基本理论问题。教材对应「DXP理论回答的基本问题」。", "source": "MZT概论教研室公众号"}, {"id": 191, "chapter": "第6章 DXP理论", "type": "单选", "question": "（ ）是我们党明确阶段性中心任务、制定路线方针政策的根本依据", "options": [{"key": "A", "text": "正确认识党和人民事业所处的历史方位和发展阶段"}, {"key": "B", "text": "大兴调查研究之风"}, {"key": "C", "text": "弄清社会主义的本质"}, {"key": "D", "text": "坚持四项基本原则"}], "answers": ["A"], "explanation": "党的十九大报告原话：「正确认识党和人民事业所处的历史方位和发展阶段，是我们党明确阶段性中心任务、制定路线方针政策的根本依据」，A项即报告原话。B项调查研究是工作方法，不是制定路线方针政策的根本依据；C项「弄清社会主义本质」是DXP理论的核心问题，但本题考的是制定阶段性中心任务的根本依据，方位+阶段判断才是答案；D项四项基本原则是改革开放的政治保证，不是阶段性任务的「根本依据」。教材对应「DXP理论的当代延续——正确认识历史方位与发展阶段」。", "source": "MZT概论教研室公众号"}, {"id": 192, "chapter": "第6章 DXP理论", "type": "单选", "question": "DXP理论走向成熟的标志是：（）", "options": [{"key": "A", "text": "党十三大报告"}, {"key": "B", "text": "南方谈话"}, {"key": "C", "text": "党十五大报告"}, {"key": "D", "text": "《DXP文选》的出版发行"}], "answers": ["B"], "explanation": "1992年DXP南方谈话，对社会主义本质、计划与市场关系、「三个有利于」标准等基本理论问题作出总结性回答，标志着DXP理论走向成熟。A项十三大形成轮廓；C项十五大把DXP理论确立为党的指导思想；D项《DXP文选》是文献汇编。教材对应「DXP理论的历史地位」。", "source": "MZT概论教研室公众号"}, {"id": 193, "chapter": "第6章 DXP理论", "type": "单选", "question": "DXP理论活的灵魂是：（）", "options": [{"key": "A", "text": "“三个有利于”标准"}, {"key": "B", "text": "四项基本原则"}, {"key": "C", "text": "解放思想,实事求是思想路线"}, {"key": "D", "text": "改革开放"}], "answers": ["C"], "explanation": "解放思想、实事求是是DXP理论的精髓，也是DXP理论的活的灵魂——贯穿DXP理论各方面的根本观点和方法。A、B、D项都是DXP理论的重要内容，但作为「活的灵魂」是解放思想、实事求是的思想路线。教材对应「解放思想和实事求是的思想路线」。", "source": "MZT概论教研室公众号"}, {"id": 194, "chapter": "第6章 DXP理论", "type": "单选", "question": "全面改革进程中思想解放的科学总结是指：（）", "options": [{"key": "A", "text": "《坚持四项基本原则》"}, {"key": "B", "text": "《解放思想，实事求，团结一致向前看》"}, {"key": "C", "text": "《DXP文选》二卷"}, {"key": "D", "text": "《在武昌、深圳、珠海、上海等地的谈话要点》"}], "answers": ["D"], "explanation": "《在武昌、深圳、珠海、上海等地的谈话要点》（即 1992年DXP南方谈话）是全面改革进程中思想解放的科学总结，回答了「什么是社会主义、怎样建设社会主义」等基本理论问题。A、B项是 1979、1978年的著作，时间更早；C项是文献汇编。教材对应「解放思想和实事求是的思想路线」。", "source": "MZT概论教研室公众号"}, {"id": 195, "chapter": "第6章 DXP理论", "type": "单选", "question": "DXP和我们党对当代中国基本国情的科学判断是：（）", "options": [{"key": "A", "text": "我国是最大的发展中国家"}, {"key": "B", "text": "我国正处于社会主义初级阶段"}, {"key": "C", "text": "中国特色社会主义进入新时代"}, {"key": "D", "text": "我国已经是发达社会主义"}], "answers": ["B"], "explanation": "DXP和我们党对当代中国基本国情的科学判断是「我国正处于并将长期处于社会主义初级阶段」。A项是国际地位上的判断；C项是新时代后的提法（不是DXP时期对基本国情的判断）；D项与实际不符。教材对应「社会主义初级阶段理论」。", "source": "MZT概论教研室公众号"}, {"id": 196, "chapter": "第6章 DXP理论", "type": "单选", "question": "党在改革开放和社会主义现代化建设新时期实现的最根本的拨乱反正是（）", "options": [{"key": "A", "text": "决定重返关税和贸易总协定组织"}, {"key": "B", "text": "决定推进祖国统一"}, {"key": "C", "text": "以经济建设为中心"}, {"key": "D", "text": "实施改革开放"}], "answers": ["C"], "explanation": "十一届三中全会作出把党和国家的工作重点转移到经济建设上来的战略决策（以经济建设为中心），这是党在改革开放新时期最根本的拨乱反正。A、B、D 三项是其他重要决策但不是「最根本的拨乱反正」。教材对应「党在社会主义初级阶段的基本路线」。", "source": "MZT概论教研室公众号"}, {"id": 197, "chapter": "第6章 DXP理论", "type": "单选", "question": "党和国家的生命线，人民的幸福线指是：（）", "options": [{"key": "A", "text": "党的基本纲领"}, {"key": "B", "text": "党的基本经验"}, {"key": "C", "text": "党的基本方略"}, {"key": "D", "text": "党的基本路线"}], "answers": ["D"], "explanation": "党的基本路线（一个中心、两个基本点）是党和国家的生命线、人民的幸福线，是党在社会主义初级阶段的总指针。A、B、C项虽然也是党的重要概念，但被特别称为「党和国家的生命线，人民的幸福线」的是党的基本路线。教材对应「党在社会主义初级阶段的基本路线」。", "source": "MZT概论教研室公众号"}, {"id": 198, "chapter": "第6章 DXP理论", "type": "单选", "question": "建设中国特色社会主义的总依据是：（）", "options": [{"key": "A", "text": "社会主义本质理论"}, {"key": "B", "text": "社会主义初级阶段理论"}, {"key": "C", "text": "社会主义改革开放理论"}, {"key": "D", "text": "社会主义根本任务理论"}], "answers": ["B"], "explanation": "建设中国特色社会主义的总依据是社会主义初级阶段——这是我国一切路线、方针、政策的基本国情依据。A、C、D项是中国特色社会主义的具体理论组成部分，但作为「总依据」的是社会主义初级阶段理论。教材对应「社会主义初级阶段理论」。", "source": "MZT概论教研室公众号"}, {"id": 199, "chapter": "第6章 DXP理论", "type": "单选", "question": "社会主义的根本任务是：（）", "options": [{"key": "A", "text": "群众运动"}, {"key": "B", "text": "阶级斗争"}, {"key": "C", "text": "发展生产力"}, {"key": "D", "text": "掌控意识形态领导权"}], "answers": ["C"], "explanation": "DXP指出社会主义的根本任务是发展生产力——这是社会主义本质的客观要求。A、B项是某些时期的工作方法或斗争方式，但不是「根本任务」；D项是意识形态工作内容。教材对应「社会主义根本任务的理论」。", "source": "MZT概论教研室公众号"}, {"id": 200, "chapter": "第6章 DXP理论", "type": "单选", "question": "中国的发展离不开科学，DXP深刻地概括为：", "options": [{"key": "A", "text": "“三个有利于”的标准"}, {"key": "B", "text": "科学兴国战略和人才强国战略"}, {"key": "C", "text": "科学技术是第一生产力"}, {"key": "D", "text": "创新驱动发展战略"}], "answers": ["C"], "explanation": "DXP提出「科学技术是第一生产力」——把科学技术摆到第一生产力的位置，是对马克思主义生产力理论的重大发展。A项是判断政策对错的标准；B、D项是后续提出的科学和人才相关战略。教材对应「社会主义根本任务的理论」。", "source": "MZT概论教研室公众号"}, {"id": 201, "chapter": "第6章 DXP理论", "type": "单选", "question": "“一个党，一个国家，一个民族，如果一切从本本出发，思想僵化，迷信盛行，那它就不能前进，它的生机就停止了，就要亡党亡国。”这句话要表达的是（）", "options": [{"key": "A", "text": "坚持走社会主义道路"}, {"key": "B", "text": "坚持解放思想、实事求是"}, {"key": "C", "text": "坚持改革开放"}, {"key": "D", "text": "中国还处在社会主义初级阶段"}], "answers": ["B"], "explanation": "这段话明确反对从本本出发、思想僵化、迷信盛行，强调党、国家、民族必须坚持解放思想、实事求是的思想路线，否则就会亡党亡国。A、C、D项虽相关但不是这段话直接表达的核心。教材对应「解放思想和实事求是的思想路线」。", "source": "MZT概论教研室公众号"}, {"id": 202, "chapter": "第6章 DXP理论", "type": "单选", "question": "建设中国特色社会主义，关键在于坚持、加强和改善（）", "options": [{"key": "A", "text": "党的领导"}, {"key": "B", "text": "基层群众自治"}, {"key": "C", "text": "社会主义市场经济"}, {"key": "D", "text": "国家发展战略"}], "answers": ["A"], "explanation": "DXP始终强调建设中国特色社会主义关键在于坚持、加强和改善党的领导——党的领导是中国特色社会主义最本质特征和最大优势。B、C、D项是相关方面，但作为「关键」的是党的领导。教材对应「党的建设理论」。", "source": "MZT概论教研室公众号"}, {"id": 203, "chapter": "第6章 DXP理论", "type": "单选", "question": "中国外交政策的基本目标是（）", "options": [{"key": "A", "text": "为经济建设创造良好国际环境"}, {"key": "B", "text": "构建友好的中外关系"}, {"key": "C", "text": "维护国家统一和领土完整"}, {"key": "D", "text": "维护我国的独立和主权，促进世界的和平与发展"}], "answers": ["D"], "explanation": "中国外交政策的基本目标是维护我国的独立和主权、促进世界的和平与发展。A项是「外交服务发展」的具体要求；B项过于具体；C项是国家主权的内容之一，但作为「基本目标」的完整表述是 D。教材对应「中国特色社会主义外交和国际战略」。", "source": "MZT概论教研室公众号"}, {"id": 204, "chapter": "第6章 DXP理论", "type": "多选", "question": "关于DXP对社会主义本质的概括，下列表述正确的是（）", "options": [{"key": "A", "text": "突出地强调解放和发展生产力在社会主义社会发展中的重要地位"}, {"key": "B", "text": "突出地强调“消灭剥削，消除两极分化，最终达到共同富裕”"}, {"key": "C", "text": "反应了人民的利益和时代要求"}, {"key": "D", "text": "把对社会主义的认识提高到新的科学水平"}], "answers": ["A", "B", "C", "D"], "explanation": "DXP对社会主义本质概括的特点：A 突出强调解放和发展生产力的重要地位；B 突出强调「消灭剥削、消除两极分化、最终达到共同富裕」；C 反映了人民的利益和时代要求；D 把对社会主义的认识提高到新的科学水平。四项均正确。教材对应「社会主义本质理论」。", "source": "MZT概论教研室公众号"}, {"id": 205, "chapter": "第6章 DXP理论", "type": "多选", "question": "DXP指出，在改革中，我们始终坚持两条根本原则，它们是（）", "options": [{"key": "A", "text": "以社会主义公有制经济为主体"}, {"key": "B", "text": "共同富裕"}, {"key": "C", "text": "与世界融为一体"}, {"key": "D", "text": "走中国特色社会主义道路"}], "answers": ["A", "B"], "explanation": "DXP指出改革中始终坚持的两条根本原则：A 以社会主义公有制经济为主体；B 共同富裕——这两条是改革不偏离社会主义方向的根本保证。C、D项是其他方面的方针或道路问题，不是DXP所指的「两条根本原则」。教材对应「社会主义改革开放理论」。", "source": "MZT概论教研室公众号"}, {"id": 206, "chapter": "第6章 DXP理论", "type": "多选", "question": "党的十三大系统阐释了社会主义初级阶段的两层含义，它们是（）", "options": [{"key": "A", "text": "我国已经是社会主义社会"}, {"key": "B", "text": "我国还处在建成社会主义社会的前夜"}, {"key": "C", "text": "我国的社会主义社会还处于初级阶段"}, {"key": "D", "text": "我国社会主义社会已经有了较好的发展"}], "answers": ["A", "C"], "explanation": "党的十三大阐释社会主义初级阶段的两层含义：A 我国已经是社会主义社会，必须坚持而不能脱离社会主义；C 我国的社会主义社会还处于初级阶段，必须从这个实际出发，不能超越这个阶段。B项与A项矛盾（社会主义已建成而非「前夜」）；D项与C项矛盾（仍处于初级阶段而非「较好发展」）。教材对应「社会主义初级阶段理论」。", "source": "MZT概论教研室公众号"}, {"id": 207, "chapter": "第6章 DXP理论", "type": "多选", "question": "关于我国社会主义初级阶段的表述，正确的是（）", "options": [{"key": "A", "text": "泛指任何国家进入社会主义都会经历的起始阶段"}, {"key": "B", "text": "特指我国建设社会主义必然要经历的特定阶段"}, {"key": "C", "text": "社会主义初阶阶段具有长期性、复杂性的特点"}, {"key": "D", "text": "是逐步摆脱贫穷、摆脱落后的阶段"}], "answers": ["B", "C", "D"], "explanation": "我国社会主义初级阶段：B 特指我国建设社会主义必然要经历的特定阶段（不是泛指）；C 具有长期性、复杂性的特点；D 是逐步摆脱贫穷、摆脱落后的阶段。A项错误，社会主义初级阶段不是泛指任何国家，而是特指我国国情下的特定阶段。教材对应「社会主义初级阶段理论」。", "source": "MZT概论教研室公众号"}, {"id": 208, "chapter": "第6章 DXP理论", "type": "多选", "question": "DXP南方谈话中提出“三个有利于”标准：", "options": [{"key": "A", "text": "是否有利于发展社会主义社会的生产力"}, {"key": "B", "text": "是否有利于增强社会主义国家的综合国力"}, {"key": "C", "text": "是否有利于提高人民的生活水平"}, {"key": "D", "text": "是否有利于融入全球体制"}], "answers": ["A", "B", "C"], "explanation": "DXP 1992年南方谈话提出的「三个有利于」标准：A 是否有利于发展社会主义社会的生产力；B 是否有利于增强社会主义国家的综合国力；C 是否有利于提高人民的生活水平。D项「融入全球体制」不是「三个有利于」内容。教材对应「社会主义本质理论（「三个有利于」标准）」。", "source": "MZT概论教研室公众号"}, {"id": 209, "chapter": "第6章 DXP理论", "type": "多选", "question": "DXP在南方谈话中指出：“社会主义本质是：”", "options": [{"key": "A", "text": "解放生产力，发展生产力"}, {"key": "B", "text": "消灭剥削，消除两极分化"}, {"key": "C", "text": "最终达到共同富裕"}, {"key": "D", "text": "实现现代化"}], "answers": ["A", "B", "C"], "explanation": "1992年DXP南方谈话指出：「社会主义的本质，是解放生产力、发展生产力，消灭剥削，消除两极分化，最终达到共同富裕。」A、B、C 三项即社会主义本质完整表述的三个层次。D项「实现现代化」是社会主义的奋斗目标而非「本质」。教材对应「社会主义本质理论」。", "source": "MZT概论教研室公众号"}, {"id": 210, "chapter": "第6章 DXP理论", "type": "多选", "question": "DXP关于社会主义本质的概括：", "options": [{"key": "A", "text": "遵循了科学社会主义的基本原则，反映了人民的利益和时代的要求，，"}, {"key": "B", "text": "廓清了不合乎时代进步和社会发展规律的模糊观念"}, {"key": "C", "text": "摆脱了长期以来拘泥于具体模式而忽略社会主义本质的错误倾向"}, {"key": "D", "text": "深化了对科学社会主义的认识"}], "answers": ["A", "B", "C", "D"], "explanation": "DXP关于社会主义本质的概括：A 遵循科学社会主义基本原则、反映人民利益和时代要求；B 廓清了不合乎时代进步和社会发展规律的模糊观念；C 摆脱了长期拘泥于具体模式而忽略社会主义本质的错误倾向；D 深化了对科学社会主义的认识。四项均是对DXP社会主义本质概括重要意义的正确论述。教材对应「社会主义本质理论（DXP社会主义本质概括的意义）」。", "source": "MZT概论教研室公众号"}, {"id": 211, "chapter": "第6章 DXP理论", "type": "多选", "question": "DXP关于社会主义本质的概括，具有重大的政治意义、理论意义和实践意义，促进（）", "options": [{"key": "A", "text": "在坚持社会主义基本制度的基础上推进改革"}, {"key": "B", "text": "社会主义的市场化、自由化和私有化改革"}, {"key": "C", "text": "改革沿着合乎社会主义本质要求的方向发展"}, {"key": "D", "text": "建设中国特色的社会主义"}], "answers": ["A", "C", "D"], "explanation": "DXP社会主义本质概括的意义在于促进：A 在坚持社会主义基本制度的基础上推进改革；C 改革沿着合乎社会主义本质要求的方向发展；D 建设中国特色社会主义。B项「市场化、自由化和私有化改革」中的「自由化、私有化」违背社会主义本质要求，是错误方向，绝不是DXP本质概括所促进的方向。教材对应「社会主义本质理论」。", "source": "MZT概论教研室公众号"}, {"id": 212, "chapter": "第6章 DXP理论", "type": "多选", "question": "DXP理论的主要内容包括（）", "options": [{"key": "A", "text": "社会主义初级阶段理论和社会主义根本任务的理论"}, {"key": "B", "text": "改革开放理论和社会主义市场经济理论"}, {"key": "C", "text": "党的基本路线和“三步走”战略"}, {"key": "D", "text": "“两手抓，两手都要硬”和“一国两制”"}], "answers": ["A", "B", "C", "D"], "explanation": "DXP理论的主要内容十分丰富：A 社会主义初级阶段理论和社会主义根本任务的理论；B 改革开放理论和社会主义市场经济理论；C 党的基本路线和「三步走」战略；D 「两手抓、两手都要硬」和「一国两制」。四项均是DXP理论的重要组成部分。教材对应「DXP理论回答的基本问题」。", "source": "MZT概论教研室公众号"}, {"id": 213, "chapter": "第6章 DXP理论", "type": "多选", "question": "“以经济建设为中心”（）", "options": [{"key": "A", "text": "回答了社会主义的根本任务问题"}, {"key": "B", "text": "体现了发展生产力的本质要求"}, {"key": "C", "text": "是兴国之要"}, {"key": "D", "text": "是党和国家兴旺发达、长治久安的根本要求"}], "answers": ["A", "B", "C", "D"], "explanation": "「以经济建设为中心」：A 回答了社会主义根本任务问题（发展生产力）；B 体现了发展生产力的本质要求；C 是兴国之要；D 是党和国家兴旺发达、长治久安的根本要求。四项均符合党对「以经济建设为中心」的论述。教材对应「党在社会主义初级阶段的基本路线；社会主义根本任务的理论」。", "source": "MZT概论教研室公众号"}, {"id": 214, "chapter": "第6章 DXP理论", "type": "多选", "question": "党和国家对我国社会主义建设经验教训和社会主要矛盾进行科学分析得出的最重要结论是（）", "options": [{"key": "A", "text": "必须进行改革开放"}, {"key": "B", "text": "社会主义的根本任务是发展生产力"}, {"key": "C", "text": "党和国家的工作重点是经济建设"}, {"key": "D", "text": "推进祖国统一是中国共产党的历史使命"}], "answers": ["B", "C"], "explanation": "对建设经验教训和主要矛盾科学分析得出的最重要结论是 B 社会主义根本任务是发展生产力、C 党和国家的工作重点是经济建设。A项改革开放是这两条结论必然导出的具体方略，但作为「最重要结论」是 B+C；D项祖国统一不是从此分析得出的「最重要结论」。教材对应「党在社会主义初级阶段的基本路线（最重要结论）」。", "source": "MZT概论教研室公众号"}, {"id": 215, "chapter": "第6章 DXP理论", "type": "多选", "question": "关于改革开放，正确的表述是（）", "options": [{"key": "A", "text": "改革是一场深刻的社会变革，是中国的二次革命"}, {"key": "B", "text": "改革是实现中国现代化的必由之路"}, {"key": "C", "text": "改革是社会主义制度的自我完善和发展"}, {"key": "D", "text": "改革近似于一个阶级推翻另一个阶级意义上的革命"}], "answers": ["A", "B", "C"], "explanation": "关于改革开放：A 是一场深刻的社会变革、是中国的二次革命（DXP语）；B 是实现中国现代化的必由之路；C 是社会主义制度的自我完善和发展。D项错误，改革不是「一个阶级推翻另一个阶级」意义上的革命，而是社会主义制度的自我完善和发展。教材对应「社会主义改革开放理论」。", "source": "MZT概论教研室公众号"}, {"id": 216, "chapter": "第6章 DXP理论", "type": "多选", "question": "DXP的社会主义市场经济理论具有丰富内涵，包括（）", "options": [{"key": "A", "text": "计划经济和市场经济不是划分社会制度的标志"}, {"key": "B", "text": "计划和市场都是经济手段"}, {"key": "C", "text": "市场经济作为资源配置手段不具有制度属性"}, {"key": "D", "text": "同世界市场的彻底接轨是中国经济改革的重要目标"}], "answers": ["A", "B", "C"], "explanation": "DXP社会主义市场经济理论的核心内涵：A 计划经济和市场经济不是划分社会制度的标志（资本主义有计划、社会主义也有市场）；B 计划和市场都是经济手段；C 市场经济作为资源配置手段不具有制度属性。D项「同世界市场的彻底接轨」不是DXP市场经济理论的具体表述（中国坚持独立自主）。教材对应「社会主义市场经济理论」。", "source": "MZT概论教研室公众号"}, {"id": 217, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "（）是改革开放以来我们的一条重要经验", "options": [{"key": "A", "text": "用发展的办法解决前进中的问题"}, {"key": "B", "text": "用妥协的办法来处理发展过程中的矛盾"}, {"key": "C", "text": "用包容的心态来化解人民群众的不满"}, {"key": "D", "text": "用专政手段来应对敌对势力的猖狂进攻"}], "answers": ["A"], "explanation": "「用发展的办法解决前进中的问题」是改革开放以来我们的一条重要经验，体现了党「发展是硬道理」「发展是党执政兴国的第一要务」的精神。B、C、D项与党的科学发展理念不符。教材对应「「三个代表」重要思想的主要内容」。", "source": "MZT概论教研室公众号"}, {"id": 218, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "我们党一贯坚持的根本组织制度和领导制度是（）", "options": [{"key": "A", "text": "人民代表大会制度"}, {"key": "B", "text": "基层自治制度"}, {"key": "C", "text": "民主集中制"}, {"key": "D", "text": "统一战线制度"}], "answers": ["C"], "explanation": "民主集中制是党一贯坚持的根本组织制度和领导制度——它把民主基础上的集中和集中指导下的民主相结合。A项是国家根本政治制度；B项是基层政治制度；D项是政治制度安排，均不是党的「根本组织制度和领导制度」。教材对应「「三个代表」重要思想的主要内容（党的建设）」。", "source": "MZT概论教研室公众号"}, {"id": 219, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "标志我国对外开放进入一个新阶段的重大事件是（）", "options": [{"key": "A", "text": "中美建立正式外交关系"}, {"key": "B", "text": "加入世界贸易组织"}, {"key": "C", "text": "成功应对08金融危机"}, {"key": "D", "text": "成功举办北京奥运会"}], "answers": ["B"], "explanation": "2001年中国加入世界贸易组织（WTO）标志着我国对外开放进入一个新阶段——全方位、多层次、宽领域的对外开放新格局。A、C、D项都是重大事件，但作为「对外开放进入新阶段」标志性事件的是加入 WTO。教材对应「「三个代表」重要思想形成的背景」。", "source": "MZT概论教研室公众号"}, {"id": 220, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "坚持党的基本路线不动摇，关键是（）不动摇", "options": [{"key": "A", "text": "坚持四项基本原则"}, {"key": "B", "text": "坚持改革开放"}, {"key": "C", "text": "坚持以经济建设为中心"}, {"key": "D", "text": "坚持人民民主专政"}], "answers": ["C"], "explanation": "坚持党的基本路线（一个中心、两个基本点）不动摇，关键是以经济建设为中心不动摇——这是社会主义初级阶段最根本的工作部署。A项四项基本原则、B项改革开放是「两个基本点」，D项是国体之一，但作为基本路线「关键」不动摇的是以经济建设为中心。教材对应「「三个代表」重要思想的主要内容」。", "source": "MZT概论教研室公众号"}, {"id": 221, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "“三个代表”重要思想产生的历史起点和逻辑起点：", "options": [{"key": "A", "text": "四项基本原则"}, {"key": "B", "text": "“四个如何认识”"}, {"key": "C", "text": "四个全面"}, {"key": "D", "text": "四个伟大"}], "answers": ["B"], "explanation": "「四个如何认识」（如何认识社会主义发展的历史进程、当代资本主义发展的历史进程、我国社会主义改革实践过程对人们思想的影响、当今世界各种思想文化相互激荡的新形势）是「三个代表」重要思想产生的历史起点和逻辑起点。A、C、D项不是「三个代表」重要思想的起点。教材对应「「三个代表」重要思想形成的背景」。", "source": "MZT概论教研室公众号"}, {"id": 222, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "勾画建立社会主义市场经济体制的蓝图和基本框架是：", "options": [{"key": "A", "text": "党十四大"}, {"key": "B", "text": "党十四届三中全会"}, {"key": "C", "text": "党十八届三中全会"}, {"key": "D", "text": "党十六大"}], "answers": ["B"], "explanation": "1993年党的十四届三中全会通过《中共中央关于建立社会主义市场经济体制若干问题的决定》，勾画了建立社会主义市场经济体制的蓝图和基本框架。A项十四大首次提出建立社会主义市场经济体制的目标；C项十八届三中全会是全面深化改革决定；D项十六大确立「三个代表」重要思想为指导思想，均不是「基本框架」的标志。教材对应「「三个代表」重要思想的主要内容（社会主义市场经济）」。", "source": "MZT概论教研室公众号"}, {"id": 223, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "“三个代表”重要思想是有机联系科学体系，“贯彻‘三个代表’要求 ，关键在：", "options": [{"key": "A", "text": "坚持与时俱进"}, {"key": "B", "text": "保持党的先进性"}, {"key": "C", "text": "坚持执政为民"}, {"key": "D", "text": "以人为本的立场"}], "answers": ["A"], "explanation": "贯彻「三个代表」要求关键在坚持与时俱进、核心在保持党的先进性、本质在坚持执政为民——这是「三个代表」思想体系的总要求。本题问「关键」，答案为 A 坚持与时俱进。教材对应「「三个代表」重要思想的核心观点」。", "source": "MZT概论教研室公众号"}, {"id": 224, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "“三个代表”重要思想是有机联系科学体系，“贯彻‘三个代表’要求 ，核心在：", "options": [{"key": "A", "text": "坚持与时俱进"}, {"key": "B", "text": "保持党的先进性"}, {"key": "C", "text": "坚持执政为民"}, {"key": "D", "text": "以人为本的立场"}], "answers": ["B"], "explanation": "贯彻「三个代表」要求关键在坚持与时俱进、核心在保持党的先进性、本质在坚持执政为民。本题问「核心」，答案为 B 保持党的先进性。教材对应「「三个代表」重要思想的核心观点」。", "source": "MZT概论教研室公众号"}, {"id": 225, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "“三个代表”重要思想是有机联系科学体系，“贯彻‘三个代表’要求 ，本质在：", "options": [{"key": "A", "text": "坚持与时俱进"}, {"key": "B", "text": "保持党的先进性"}, {"key": "C", "text": "坚持执政为民"}, {"key": "D", "text": "以人为本的立场"}], "answers": ["C"], "explanation": "贯彻「三个代表」要求关键在坚持与时俱进、核心在保持党的先进性、本质在坚持执政为民。本题问「本质」，答案为 C 坚持执政为民。教材对应「「三个代表」重要思想的核心观点」。", "source": "MZT概论教研室公众号"}, {"id": 226, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "JZM曾强调指出，马克思主义最重要的理论品质是：", "options": [{"key": "A", "text": "批评与自我批评"}, {"key": "B", "text": "敢讲真话，做实事"}, {"key": "C", "text": "与时俱进"}, {"key": "D", "text": "尊重实践、尊重群众"}], "answers": ["C"], "explanation": "JZM强调马克思主义最重要的理论品质是「与时俱进」——理论必须随时代发展不断丰富完善。A项是党内政治生活作风；B、D项是工作方法和原则，均不是「最重要的理论品质」。教材对应「「三个代表」重要思想的核心观点」。", "source": "MZT概论教研室公众号"}, {"id": 227, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "生产力最革命、最活跃的因素是：", "options": [{"key": "A", "text": "生产资料"}, {"key": "B", "text": "科学技术"}, {"key": "C", "text": "人"}, {"key": "D", "text": "劳动对象"}], "answers": ["C"], "explanation": "在生产力三要素（劳动者、生产资料、劳动对象）中，人（劳动者）是最革命、最活跃的因素。B项科学技术是第一生产力，但作为生产力中「最革命最活跃的因素」指的是人；A、D项属生产资料、劳动对象，相对人是被动要素。教材对应「「三个代表」重要思想的主要内容（始终代表中国先进生产力发展要求）」。", "source": "MZT概论教研室公众号"}, {"id": 228, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "JZM指出，第一资源是：", "options": [{"key": "A", "text": "石油资源"}, {"key": "B", "text": "生态资源"}, {"key": "C", "text": "人才资源"}, {"key": "D", "text": "劳动力资源"}], "answers": ["C"], "explanation": "JZM指出人才资源是第一资源——人才是兴党兴国之本、富民强国之基。A、B、D项虽是重要资源，但作为「第一资源」特指人才。教材对应「「三个代表」重要思想的主要内容」。", "source": "MZT概论教研室公众号"}, {"id": 229, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "我们党站在时代前列，保持先进性的根本体现和根本要求是：", "options": [{"key": "A", "text": "必须牢牢把握先进文化的前进方向，建设社会主义精神文明"}, {"key": "B", "text": "不断实现好维护好发展好最广大人民的根本利益"}, {"key": "C", "text": "满足人民群众日益增长的物质文化需要"}, {"key": "D", "text": "始终代表中国先进生产力的发展要求，大力促进先进生产力的发展"}], "answers": ["D"], "explanation": "我们党站在时代前列、保持先进性的根本体现和根本要求是「始终代表中国先进生产力的发展要求、大力促进先进生产力的发展」。A项是第二个代表，B项是第三个代表，C项是发展的目的，但作为「根本体现和根本要求」（先进性）的是 D 第一个代表。教材对应「「三个代表」重要思想的核心观点」。", "source": "MZT概论教研室公众号"}, {"id": 230, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "JZM同志强调，我们全部工作的出发点和落脚点，就是：", "options": [{"key": "A", "text": "构建人类命运共同体"}, {"key": "B", "text": "建设社会主义精神文明"}, {"key": "C", "text": "不断实现好维护好发展好最广大人民的根本利益"}, {"key": "D", "text": "建立和谐世界"}], "answers": ["C"], "explanation": "JZM强调党的全部工作的出发点和落脚点就是不断实现好、维护好、发展好最广大人民的根本利益——这是「三个代表」的第三个代表的核心内容。A、D项是国际战略提法；B项是文化建设范畴，均不是「全部工作的出发点和落脚点」。教材对应「「三个代表」重要思想的核心观点（代表最广大人民根本利益）」。", "source": "MZT概论教研室公众号"}, {"id": 231, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "党要承担起推动中国社会进步的历史责任，必须始终紧紧抓住：", "options": [{"key": "A", "text": "战略机遇期"}, {"key": "B", "text": "科教兴国战略"}, {"key": "C", "text": "发展这个执政兴国的第一要务"}, {"key": "D", "text": "社会主义政治文明建设"}], "answers": ["C"], "explanation": "JZM指出，党要承担起推动中国社会进步的历史责任，必须始终紧紧抓住「发展这个执政兴国的第一要务」。A项战略机遇期是发展的有利条件；B项科教兴国是具体战略；D项政治文明建设是其中一个领域，均不是「必须紧紧抓住」的根本要务。教材对应「「三个代表」重要思想的主要内容」。", "source": "MZT概论教研室公众号"}, {"id": 232, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "明确提出使用“社会主义市场经体制”这个提法的是：", "options": [{"key": "A", "text": "DXP"}, {"key": "B", "text": "JZM"}, {"key": "C", "text": "HJT"}, {"key": "D", "text": "XJP"}], "answers": ["B"], "explanation": "这题考谁正式提出「社会主义市场经济体制」这个规范提法，不是泛泛问谁讲过市场经济。1992年党的十四大，JZM代表党中央明确提出建立社会主义市场经济体制。A项DXP提出和推动了市场经济相关思想，但本题锁的是规范提法的正式提出；C、D项时间更晚。教材对应「「三个代表」重要思想的主要内容（社会主义市场经济体制）」。", "source": "MZT概论教研室公众号"}, {"id": 233, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "在建设社会主义市场经济体制过程中，进一步探索公有制特别是国有制的多种有效实现形式，积极推行", "options": [{"key": "A", "text": "股份制"}, {"key": "B", "text": "股份合作制"}, {"key": "C", "text": "承包制"}, {"key": "D", "text": "租赁制"}], "answers": ["A"], "explanation": "在建设社会主义市场经济体制过程中，积极推行股份制，作为公有制（特别是国有制）的有效实现形式。B、C、D项是具体形式，但作为「积极推行」的核心提法是股份制。教材对应「「三个代表」重要思想的主要内容」。", "source": "MZT概论教研室公众号"}, {"id": 234, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "社会主义(初级阶段)基本经济制度是：", "options": [{"key": "A", "text": "公有制为主体、多种所有制经济共同发展"}, {"key": "B", "text": "各类市场主体自由竞争"}, {"key": "C", "text": "建立健全社会主义分配制度"}, {"key": "D", "text": "国家保护一切财产安全和利益"}], "answers": ["A"], "explanation": "社会主义初级阶段的基本经济制度是公有制为主体、多种所有制经济共同发展——这是党在十五大正式确立、十六大重申的基本经济制度。B、C、D项是经济运行方面，不是「基本经济制度」。教材对应「「三个代表」重要思想的主要内容」。", "source": "MZT概论教研室公众号"}, {"id": 235, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "JZM在（）把社会主义物质文明、政治文明、精神文明一起确立为社会主义现代化全面发展的三大基本目标。", "options": [{"key": "A", "text": "党十五大报告中"}, {"key": "B", "text": "党十六大报告中"}, {"key": "C", "text": "建党八十周年讲话中"}, {"key": "D", "text": "党十四届三中全会的讲话中"}], "answers": ["B"], "explanation": "JZM在 2002年党的十六大报告中把社会主义物质文明、政治文明、精神文明一起确立为社会主义现代化建设全面发展的三大基本目标。A、C、D项时间均早于十六大。教材对应「「三个代表」重要思想的主要内容」。", "source": "MZT概论教研室公众号"}, {"id": 236, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "建设社会主义政治文明，最根本的就是要：", "options": [{"key": "A", "text": "坚持党的领导、人民当家作主和依法治国的有机统一"}, {"key": "B", "text": "全面进行政治体制改革，建立宪政国家"}, {"key": "C", "text": "全面建成小康社会，实现经济高速增长扩张"}, {"key": "D", "text": "坚持改革开放，建设法制国家"}], "answers": ["A"], "explanation": "建设社会主义政治文明，最根本的就是要坚持党的领导、人民当家作主和依法治国的有机统一。B项「建立宪政国家」不是党的政治建设标准表述；C项是发展目标；D项是相关方面，但作为「最根本的」是党的领导、人民当家作主和依法治国的有机统一。教材对应「「三个代表」重要思想的主要内容（政治文明建设）」。", "source": "MZT概论教研室公众号"}, {"id": 237, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "坚持党的领导，核心是（）", "options": [{"key": "A", "text": "坚持党要管党"}, {"key": "B", "text": "坚持党的先进性"}, {"key": "C", "text": "坚持党的优良传统"}, {"key": "D", "text": "坚持党的阶级基础"}], "answers": ["B"], "explanation": "坚持党的领导，核心是坚持党的先进性——「三个代表」重要思想的核心就在于保持党的先进性。A项党要管党是党建总要求；C、D项是相关方面，但作为「核心」是坚持党的先进性。教材对应「「三个代表」重要思想的主要内容（党的领导与党的建设）」。", "source": "MZT概论教研室公众号"}, {"id": 238, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "JZM强调推进党的建设新的伟大工程，重点是加强：", "options": [{"key": "A", "text": "党的群众基础"}, {"key": "B", "text": "党的执政能力建设"}, {"key": "C", "text": "党的阶级基础"}, {"key": "D", "text": "党的组织建设"}], "answers": ["B"], "explanation": "JZM强调推进党的建设新的伟大工程，重点是加强党的执政能力建设——这是党的十六大确立的党建总主题。A、C、D项是党建相关方面，但作为新时期党建「重点」是执政能力建设。教材对应「「三个代表」重要思想的主要内容（党的建设）」。", "source": "MZT概论教研室公众号"}, {"id": 239, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "JZM强调，领导干部要讲学习、讲政治、讲正气，其中前提是：", "options": [{"key": "A", "text": "讲学习"}, {"key": "B", "text": "讲政治"}, {"key": "C", "text": "讲正气"}, {"key": "D", "text": "讲原则"}], "answers": ["A"], "explanation": "JZM提出领导干部要讲学习、讲政治、讲正气，其中讲学习是前提、讲政治是核心、讲正气是基础。本题问「前提」，答案为 A 讲学习。教材对应「「三个代表」重要思想的主要内容（党的建设）」。", "source": "MZT概论教研室公众号"}, {"id": 240, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "JZM强调，领导干部要讲学习、讲政治、讲正气，其中核心是：", "options": [{"key": "A", "text": "讲学习"}, {"key": "B", "text": "讲政治"}, {"key": "C", "text": "讲正气"}, {"key": "D", "text": "讲原则"}], "answers": ["B"], "explanation": "JZM提出领导干部要讲学习、讲政治、讲正气，其中讲学习是前提、讲政治是核心、讲正气是基础。本题问「核心」，答案为 B 讲政治。教材对应「「三个代表」重要思想的主要内容（党的建设）」。", "source": "MZT概论教研室公众号"}, {"id": 241, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "JZM强调，加强和改进党的作风建设，核心问题是（）", "options": [{"key": "A", "text": "保持党的执政地位"}, {"key": "B", "text": "坚持党的领导地位"}, {"key": "C", "text": "保持党的利益不受影响与损害"}, {"key": "D", "text": "保持党同人民群众的血肉联系"}], "answers": ["D"], "explanation": "JZM强调加强和改进党的作风建设，核心问题是保持党同人民群众的血肉联系。A、B项是党的政治地位，C项措辞错误（党无私利），均不是「作风建设的核心问题」。教材对应「「三个代表」重要思想的主要内容（党的作风建设）」。", "source": "MZT概论教研室公众号"}, {"id": 242, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "JZM强调，我们党的最大的政治优势是：", "options": [{"key": "A", "text": "党员数量众多，是世界第一大党"}, {"key": "B", "text": "当今中国的执政党、领导党"}, {"key": "C", "text": "从小到大，从弱变强，走过近百年的历程"}, {"key": "D", "text": "密切联系群众"}], "answers": ["D"], "explanation": "JZM强调党最大的政治优势是密切联系群众——这是党的力量源泉和胜利保证。A、B、C项虽是党的客观事实或历史，但不是「最大的政治优势」。教材对应「「三个代表」重要思想的主要内容（党的作风建设）」。", "source": "MZT概论教研室公众号"}, {"id": 243, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "JZM强调，我们党执政后最大的危险是（）", "options": [{"key": "A", "text": "能力不足"}, {"key": "B", "text": "精神懈怠"}, {"key": "C", "text": "脱离群众"}, {"key": "D", "text": "消极腐败"}], "answers": ["C"], "explanation": "JZM强调党执政后最大的危险是脱离群众——这与党「最大的政治优势是密切联系群众」形成对照。A、B、D项是党面临的其他危险（如十八大后概括的「四大危险」中也包括），但JZM时期「最大的危险」特指脱离群众。教材对应「「三个代表」重要思想的主要内容（党的建设）」。", "source": "MZT概论教研室公众号"}, {"id": 244, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "我们党的立党之本、执政之基、力量之源是（）", "options": [{"key": "A", "text": "始终进行理论创新"}, {"key": "B", "text": "始终与时代同进步，与世界同发展"}, {"key": "C", "text": "始终做到“三个代表”"}, {"key": "D", "text": "始终做到独立自主、自力更生"}], "answers": ["C"], "explanation": "JZM指出：始终做到「三个代表」，是我们党的立党之本、执政之基、力量之源。A、B、D项是党建工作的相关方面，但作为「立党之本、执政之基、力量之源」三位一体的核心提法是「始终做到三个代表」。教材对应「「三个代表」重要思想的核心观点」。", "source": "MZT概论教研室公众号"}, {"id": 245, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "“三个代表”重要思想在DXP理论的基础上，进一步，创造性地回答了（）", "options": [{"key": "A", "text": "什么是社会主义、怎样建设社会主义的问题"}, {"key": "B", "text": "进行什么样的革命，怎样进行革命的问题"}, {"key": "C", "text": "实现什么样的发展，怎样发展的问题"}, {"key": "D", "text": "建设什么样的党、怎样建设党的问题"}], "answers": ["D"], "explanation": "资料库简答题明确：「三个代表」重要思想进一步回答了什么是社会主义、怎样建设社会主义的问题，并「创造性地回答了建设什么样的党、怎样建设党的问题」。本题强调「创造性地回答」——答案是 D。A项是DXP理论已回答的问题；B项不属于建设时期问题；C项是科学发展观回答的问题。教材对应「「三个代表」重要思想的历史地位」。", "source": "MZT概论教研室公众号"}, {"id": 246, "chapter": "第7章 「三个代表」重要思想", "type": "单选", "question": "JZM在党的十五大报告中明确指出：依法治国，是党领导人民治理国家的（）", "options": [{"key": "A", "text": "基本方略"}, {"key": "B", "text": "基本路线"}, {"key": "C", "text": "基本纲领"}, {"key": "D", "text": "基本经验"}], "answers": ["A"], "explanation": "1997年JZM在党的十五大报告中明确指出：依法治国是党领导人民治理国家的基本方略。B项基本路线是一个中心两个基本点；C项基本纲领是党的纲领性文件提法；D项基本经验是经验总结表述，均不是依法治国的定位。教材对应「「三个代表」重要思想的主要内容」。", "source": "MZT概论教研室公众号"}, {"id": 247, "chapter": "第7章 「三个代表」重要思想", "type": "多选", "question": "JZM同志认为，中国共产党必须解决好的两大历史性课题是（）。", "options": [{"key": "A", "text": "纠正党的不良作风"}, {"key": "B", "text": "进一步提高党的领导水平和执政水平"}, {"key": "C", "text": "防范“四大危险”"}, {"key": "D", "text": "提高拒腐防变和抵御风险的能力"}], "answers": ["B", "D"], "explanation": "JZM提出党必须解决好的两大历史性课题是：B 进一步提高党的领导水平和执政水平；D 提高拒腐防变和抵御风险的能力。A项是具体工作；C项「四大危险」是党的十八大后提出的概念，不属于JZM提出的两大历史性课题。教材对应「「三个代表」重要思想的核心观点（两大历史性课题）」。", "source": "MZT概论教研室公众号"}, {"id": 248, "chapter": "第7章 「三个代表」重要思想", "type": "多选", "question": "2000年5月，JZM在上海主持党建工作座谈会，强调:“三个代表”重要思想是（）。", "options": [{"key": "A", "text": "立党之本"}, {"key": "B", "text": "执政之基"}, {"key": "C", "text": "强国之路"}, {"key": "D", "text": "力量之源"}], "answers": ["A", "B", "D"], "explanation": "JZM强调「三个代表」重要思想是党的立党之本（A）、执政之基（B）、力量之源（D）。C项「强国之路」是「改革开放是强国之路」，不是「三个代表」思想的定位。教材对应「「三个代表」重要思想的核心观点」。", "source": "MZT概论教研室公众号"}, {"id": 249, "chapter": "第7章 「三个代表」重要思想", "type": "多选", "question": "JZM强调，我们想事情，做工作，想得对不对，做得好不好，根本的衡量尺度，就是（）。", "options": [{"key": "A", "text": "人民拥护不拥护"}, {"key": "B", "text": "人民赞成不赞成"}, {"key": "C", "text": "人民高兴不高兴"}, {"key": "D", "text": "人民答应不答应"}], "answers": ["A", "B", "C", "D"], "explanation": "JZM强调党想事情做工作的根本衡量尺度是「四个不」——人民拥护不拥护（A）、人民赞成不赞成（B）、人民高兴不高兴（C）、人民答应不答应（D）。四项均符合党的群众路线根本判断标准。教材对应「「三个代表」重要思想的主要内容（代表最广大人民根本利益）」。", "source": "MZT概论教研室公众号"}, {"id": 250, "chapter": "第7章 「三个代表」重要思想", "type": "多选", "question": "“三个代表”的相互关系是（）", "options": [{"key": "A", "text": "发展先进生产力，是发展先进文化的、实现最广大人民根本利益的基础和前提"}, {"key": "B", "text": "发展先进文化，是发展先进生产力和实现最广大人民根本利益的重要思想保证"}, {"key": "C", "text": "发展先进生产力和先进文化，归根到底都是为了实现最广大人民的根本利益"}, {"key": "D", "text": "三者是统一的整体，相互联系，相互促进"}], "answers": ["A", "B", "C", "D"], "explanation": "「三个代表」的相互关系：A 发展先进生产力是基础和前提；B 发展先进文化是重要思想保证；C 发展先进生产力和先进文化归根到底是为实现最广大人民根本利益；D 三者是统一整体、相互联系、相互促进。四项均正确。教材对应「「三个代表」重要思想的核心观点（三者关系）」。", "source": "MZT概论教研室公众号"}, {"id": 251, "chapter": "第7章 「三个代表」重要思想", "type": "多选", "question": "在十六大报告中，JZM把社会主义（）一起确立为社会主义现代化建设的目标。", "options": [{"key": "A", "text": "物质文明"}, {"key": "B", "text": "政治文明"}, {"key": "C", "text": "生态文明"}, {"key": "D", "text": "精神文明"}], "answers": ["A", "B", "D"], "explanation": "十六大报告把社会主义物质文明（A）、政治文明（B）、精神文明（D）一起确立为社会主义现代化建设的目标。C项生态文明是党的十七大才提出、十八大进一步深化（「五位一体」），不在十六大确立的三大文明范围内。教材对应「「三个代表」重要思想的主要内容（三大文明）」。", "source": "MZT概论教研室公众号"}, {"id": 252, "chapter": "第7章 「三个代表」重要思想", "type": "多选", "question": "JZM要求领导干部一定要（）。", "options": [{"key": "A", "text": "讲公正"}, {"key": "B", "text": "讲学习"}, {"key": "C", "text": "讲政治"}, {"key": "D", "text": "讲正气"}], "answers": ["B", "C", "D"], "explanation": "JZM要求领导干部一定要讲学习（B）、讲政治（C）、讲正气（D），简称「三讲」。A项「讲公正」不是JZM「三讲」的内容。教材对应「「三个代表」重要思想的主要内容（领导干部素质）」。", "source": "MZT概论教研室公众号"}, {"id": 253, "chapter": "第7章 「三个代表」重要思想", "type": "多选", "question": "“三个代表”重要思想是（）。", "options": [{"key": "A", "text": "马克思列宁主义、MZD思想和DXP理论的继承和发展"}, {"key": "B", "text": "中国特色社会主义理论体系的重要组成部分"}, {"key": "C", "text": "中国特色社会主义理论体系的接续发展"}, {"key": "D", "text": "推进中国特色社会主义事业的强大理论武器"}], "answers": ["A", "B", "C", "D"], "explanation": "「三个代表」重要思想：A 是马克思列宁主义、MZD思想和DXP理论的继承和发展；B 是中国特色社会主义理论体系的重要组成部分；C 是中国特色社会主义理论体系的接续发展；D 是推进中国特色社会主义事业的强大理论武器。四项均符合资料库简答题对其历史地位的论述。教材对应「「三个代表」重要思想的历史地位」。", "source": "MZT概论教研室公众号"}, {"id": 254, "chapter": "第7章 「三个代表」重要思想", "type": "多选", "question": "坚持中国共产党的领导，就是要（）。", "options": [{"key": "A", "text": "坚持党在建设中国特色社会主义事业中的领导核心地位，发挥党总揽全局、协调各方的作用"}, {"key": "B", "text": "坚持党对国家大政方针和全局工作的政治领导"}, {"key": "C", "text": "坚持党管干部的原则"}, {"key": "D", "text": "坚持党对意识形态领域的领导"}], "answers": ["A", "B", "C", "D"], "explanation": "坚持中国共产党的领导，就是要：A 坚持党的领导核心地位、发挥党总揽全局协调各方作用；B 坚持党对国家大政方针和全局工作的政治领导；C 坚持党管干部的原则；D 坚持党对意识形态领域的领导。四项是党的领导体制和运行方式的完整内涵。教材对应「「三个代表」重要思想的主要内容（党的领导）」。", "source": "MZT概论教研室公众号"}, {"id": 255, "chapter": "第7章 「三个代表」重要思想", "type": "多选", "question": "“三个代表”重要思想从（）方面，揭示了社会主义制度自我完善和发展的途径，", "options": [{"key": "A", "text": "物质基础"}, {"key": "B", "text": "文化支撑"}, {"key": "C", "text": "政治保证"}, {"key": "D", "text": "社会基础"}], "answers": ["A", "B", "D"], "explanation": "「三个代表」思想从物质基础（A，先进生产力）、文化支撑（B，先进文化）、社会基础（D，最广大人民根本利益）三个方面揭示了社会主义制度自我完善和发展的途径。C项「政治保证」不是「三个代表」思想揭示的三方面之一。教材对应「「三个代表」重要思想的历史地位」。", "source": "MZT概论教研室公众号"}, {"id": 256, "chapter": "第7章 「三个代表」重要思想", "type": "多选", "question": "之所以要全面建设小康社会，是因为（）。", "options": [{"key": "A", "text": "总体小康社会是低水平的、不全面的、不平衡的"}, {"key": "B", "text": "我国人均生产的物质产品和物质财富较少，劳动生产率较低"}, {"key": "C", "text": "总体小康社会偏重于满足物质消费，而文化消费还得不到有效满足"}, {"key": "D", "text": "存在地区之间、城乡之间的发展不协调、不平衡问题"}], "answers": ["A", "B", "C", "D"], "explanation": "要全面建设小康社会原因：A 总体小康社会是低水平、不全面、不平衡的；B 人均生产物质产品和物质财富较少、劳动生产率较低；C 总体小康偏重物质消费、文化消费还得不到有效满足；D 存在地区之间、城乡之间发展不协调不平衡问题。四项揭示了「总体小康」的局限性。教材对应「「三个代表」重要思想的主要内容（全面建设小康社会）」。", "source": "MZT概论教研室公众号"}, {"id": 257, "chapter": "第7章 「三个代表」重要思想", "type": "多选", "question": "关于正确认识改革、发展、稳定的关系，下列表述正确的是（）", "options": [{"key": "A", "text": "改革是动力，发展是目的，稳定是前提"}, {"key": "B", "text": "没有改革，就不可能走出中国特色社会主义正确道路"}, {"key": "C", "text": "没有发展，就不可能实现现代化"}, {"key": "D", "text": "没有稳定，改革和发展照样能够实现"}], "answers": ["A", "B", "C"], "explanation": "改革、发展、稳定的关系：A 改革是动力、发展是目的、稳定是前提；B 没有改革就不可能走出中国特色社会主义正确道路；C 没有发展就不可能实现现代化。D项错误：没有稳定，改革和发展无从谈起（稳定是前提），故「没有稳定改革和发展照样能够实现」是错误表述。教材对应「「三个代表」重要思想的主要内容（改革发展稳定关系）」。", "source": "MZT概论教研室公众号"}, {"id": 258, "chapter": "第7章 「三个代表」重要思想", "type": "多选", "question": "关于发展先进文化，下列表述正确的是（）", "options": [{"key": "A", "text": "是实现社会主义现代化的战略任务"}, {"key": "B", "text": "就是发展中国特色社会主义文化"}, {"key": "C", "text": "就是发展面向现代化、面向世界、面向未来的、民族的科学的大众的社会主义文化"}, {"key": "D", "text": "要把弘扬主旋律和提倡多样化统一起来"}], "answers": ["A", "B", "C", "D"], "explanation": "发展先进文化：A 是实现社会主义现代化的战略任务；B 就是发展中国特色社会主义文化；C 就是发展「面向现代化、面向世界、面向未来的、民族的科学的大众的社会主义文化」（「二为方向、双百方针、三个面向」）；D 要把弘扬主旋律和提倡多样化统一起来。四项均符合党对先进文化的论述。教材对应「「三个代表」重要思想的主要内容（先进文化建设）」。", "source": "MZT概论教研室公众号"}, {"id": 259, "chapter": "第8章 科学发展观", "type": "单选", "question": "在当代中国，坚持发展是硬道理的本质要求就是（）", "options": [{"key": "A", "text": "坚持科学发展"}, {"key": "B", "text": "走均衡发展的道路"}, {"key": "C", "text": "以人民群众为核心"}, {"key": "D", "text": "坚持改革开放"}], "answers": ["A"], "explanation": "在当代中国，坚持发展是硬道理的本质要求就是坚持科学发展——只有科学发展，才能解决发展中的各种问题。B项均衡发展是科学发展的一个方面；C项措辞不准确；D项改革开放是动力，但本质要求是「坚持科学发展」。教材对应「科学发展观的科学内涵」。", "source": "MZT概论教研室公众号"}, {"id": 260, "chapter": "第8章 科学发展观", "type": "单选", "question": "坚持以人为本，最终是为了（）", "options": [{"key": "A", "text": "人的自由和解放"}, {"key": "B", "text": "人的富裕与平等"}, {"key": "C", "text": "人的全面发展"}, {"key": "D", "text": "人的充分发展"}], "answers": ["C"], "explanation": "坚持以人为本，最终是为了人的全面发展——这是马克思主义关于人的发展的根本目标。A、B项是相关重要方面，D项措辞不规范，党的标准提法是「人的全面发展」。教材对应「科学发展观的科学内涵（以人为本）」。", "source": "MZT概论教研室公众号"}, {"id": 261, "chapter": "第8章 科学发展观", "type": "单选", "question": "科学发展观的第一要义是（）", "options": [{"key": "A", "text": "以人为本"}, {"key": "B", "text": "稳定"}, {"key": "C", "text": "改革"}, {"key": "D", "text": "推动经济社会发展"}], "answers": ["D"], "explanation": "资料库简答题明确：科学发展观第一要义是发展，本选项即「推动经济社会发展」。A项以人为本是核心立场；B、C项是工作大局中的方面，不是「第一要义」。教材对应「科学发展观的科学内涵」。", "source": "MZT概论教研室公众号"}, {"id": 262, "chapter": "第8章 科学发展观", "type": "单选", "question": "科学发展观的基本要求是（）", "options": [{"key": "A", "text": "以人为本"}, {"key": "B", "text": "全面协调可持续"}, {"key": "C", "text": "统筹兼顾"}, {"key": "D", "text": "发展"}], "answers": ["B"], "explanation": "坑在同一理论里的词全都眼熟，但题干只问「基本要求」这一格，不能见熟词就选。资料库简答题明确：科学发展观基本要求是全面协调可持续。A项以人为本是核心立场；C项统筹兼顾是根本方法；D项发展是第一要义。教材对应「科学发展观的科学内涵」。", "source": "MZT概论教研室公众号"}, {"id": 263, "chapter": "第8章 科学发展观", "type": "单选", "question": "科学发展观的根本方法是（）", "options": [{"key": "A", "text": "以人为本"}, {"key": "B", "text": "全面协调可持续"}, {"key": "C", "text": "统筹兼顾"}, {"key": "D", "text": "发展"}], "answers": ["C"], "explanation": "坑在同一理论里的词全都眼熟，但题干只问「根本方法」这一格，不能见熟词就选。资料库简答题明确：科学发展观根本方法是统筹兼顾。A项以人为本是核心立场；B项全面协调可持续是基本要求；D项发展是第一要义。教材对应「科学发展观的科学内涵」。", "source": "MZT概论教研室公众号"}, {"id": 264, "chapter": "第8章 科学发展观", "type": "单选", "question": "科学发展观所说的以人为本是（）", "options": [{"key": "A", "text": "以全体中国公民利益为本"}, {"key": "B", "text": "以中国最广大人民的根本利益为本"}, {"key": "C", "text": "以中国人民的所有利益和自由为本"}, {"key": "D", "text": "以中华民族的利益为本"}], "answers": ["B"], "explanation": "科学发展观所说的「以人为本」是以中国最广大人民的根本利益为本——这是党的全心全意为人民服务宗旨的体现。A、C、D项措辞不规范，党的标准表述是「以中国最广大人民的根本利益为本」。教材对应「科学发展观的科学内涵（以人为本）」。", "source": "MZT概论教研室公众号"}, {"id": 265, "chapter": "第8章 科学发展观", "type": "单选", "question": "HJT指出，我们推进发展的根本目的就是（）", "options": [{"key": "A", "text": "社会秩序稳定"}, {"key": "B", "text": "保证党的执政地位"}, {"key": "C", "text": "建立和谐世界"}, {"key": "D", "text": "造福人民"}], "answers": ["D"], "explanation": "HJT指出，我们推进发展的根本目的就是造福人民——发展为了人民、发展依靠人民、发展成果由人民共享。A、B、C项是其他目标或相关方面，但根本目的是造福人民。教材对应「科学发展观的主要内容（以人为本）」。", "source": "MZT概论教研室公众号"}, {"id": 266, "chapter": "第8章 科学发展观", "type": "单选", "question": "全面协调可持续中的“全面”是指（）", "options": [{"key": "A", "text": "发展要有协调性、均衡性，各个方面、各个环节的发展要相互适应、相互促进"}, {"key": "B", "text": "发展要有全面性、整体性，不仅经济发展，而且各个方面都要发展"}, {"key": "C", "text": "发展要有持久性、连续性，不仅当前要发展，而且要保证长远发展"}, {"key": "D", "text": "发展要有速度、效率、时间，不仅追求公平、正义、平衡"}], "answers": ["B"], "explanation": "「全面」指发展要有全面性、整体性——不仅经济发展，而且各个方面都要发展（B）。A项是「协调」的含义；C项是「可持续」的含义；D项不符合科学发展观表述。教材对应「科学发展观的基本要求（全面协调可持续）」。", "source": "MZT概论教研室公众号"}, {"id": 267, "chapter": "第8章 科学发展观", "type": "单选", "question": "全面协调可持续中的 “协调”是指（）", "options": [{"key": "A", "text": "发展要有协调性、均衡性，各个方面、各个环节的发展要相互适应、相互促进"}, {"key": "B", "text": "发展要有全面性、整体性，不仅经济发展，而且各个方面都要发展"}, {"key": "C", "text": "发展要有持久性、连续性，不仅当前要发展，而且要保证长远发展"}, {"key": "D", "text": "发展要有速度、效率、时间，不仅追求公平、正义、平衡"}], "answers": ["A"], "explanation": "「协调」指发展要有协调性、均衡性——各个方面、各个环节的发展要相互适应、相互促进（A）。B项是「全面」的含义；C项是「可持续」的含义；D项与科学发展观表述不符。教材对应「科学发展观的基本要求（全面协调可持续）」。", "source": "MZT概论教研室公众号"}, {"id": 268, "chapter": "第8章 科学发展观", "type": "单选", "question": "全面协调可持续中的“可持续”是指（）", "options": [{"key": "A", "text": "发展要有协调性、均衡性，各个方面、各个环节的发展要相互适应、相互促进"}, {"key": "B", "text": "发展要有全面性、整体性，不仅经济发展，而且各个方面都要发展"}, {"key": "C", "text": "发展要有持久性、连续性，不仅当前要发展，而且要保证长远发展"}, {"key": "D", "text": "发展要有速度、效率、时间，不仅追求公平、正义、平衡"}], "answers": ["C"], "explanation": "「可持续」指发展要有持久性、连续性——不仅当前要发展，而且要保证长远发展（C）。A项是「协调」的含义；B项是「全面」的含义；D项与科学发展观表述不符。教材对应「科学发展观的基本要求（全面协调可持续）」。", "source": "MZT概论教研室公众号"}, {"id": 269, "chapter": "第8章 科学发展观", "type": "单选", "question": "科学发展观强调，社会主义民主政治的本质和核心是（）", "options": [{"key": "A", "text": "人民当家作主"}, {"key": "B", "text": "发展社会主义社会生产力"}, {"key": "C", "text": "建立现代经济体系"}, {"key": "D", "text": "实现人民愿望、满足人民需要、维护人民利益"}], "answers": ["A"], "explanation": "科学发展观强调社会主义民主政治的本质和核心是人民当家作主。B项是经济建设领域；C项是经济体系建设；D项是党的执政内容，但社会主义民主政治的「本质和核心」是人民当家作主。教材对应「科学发展观的主要内容（社会主义民主政治）」。", "source": "MZT概论教研室公众号"}, {"id": 270, "chapter": "第8章 科学发展观", "type": "单选", "question": "HJT强调，决定着中国特色社会主义发展方向是（）", "options": [{"key": "A", "text": "社会主义核心价值体系"}, {"key": "B", "text": "社会主义市场经济体制"}, {"key": "C", "text": "中国共产党的领导和执政"}, {"key": "D", "text": "发展社会主义生产力，特别是先进生产力"}], "answers": ["A"], "explanation": "HJT强调，社会主义核心价值体系决定着中国特色社会主义发展方向——文化价值是发展方向的灵魂。B项是经济体制；C项是领导核心；D项是生产力发展，但作为「决定发展方向」的根本是核心价值体系。教材对应「科学发展观的主要内容（文化建设）」。", "source": "MZT概论教研室公众号"}, {"id": 271, "chapter": "第8章 科学发展观", "type": "单选", "question": "HJT的这个重大判断，深刻总结了国内外社会主义建设的历史经验，深化了对社会主义本质的认识。这个重大判断是（）", "options": [{"key": "A", "text": "“社会和谐是中国特色社会主义的本质属性。”"}, {"key": "B", "text": "“社会主义核心价值体系是根源于民族优秀文化和社会主义先进文化并吸收人类文明成果发展起来的”"}, {"key": "C", "text": "“每一个共产党员都要把人民放在心中最高位置，尊重人民主体地位，尊重人民首创精神，拜人民为师，”"}, {"key": "D", "text": "“物质贫乏不是社会主义，精神空虚也不是社会主义。没有社会主义文化繁荣发展，就没有社会主义现代化”"}], "answers": ["A"], "explanation": "HJT作出「社会和谐是中国特色社会主义的本质属性」这一重大判断，深刻总结国内外社会主义建设历史经验、深化了对社会主义本质的认识。B、C、D项是其他重要论断，但题干强调「深化了对社会主义本质的认识」，指向A项的本质属性论断。教材对应「科学发展观的主要内容（构建社会主义和谐社会）」。", "source": "MZT概论教研室公众号"}, {"id": 272, "chapter": "第8章 科学发展观", "type": "单选", "question": "（）是马克思主义政党的本质属性，是马克思主义政党的生命所系、力量所在。", "options": [{"key": "A", "text": "先进性"}, {"key": "B", "text": "阶级性"}, {"key": "C", "text": "全民性"}, {"key": "D", "text": "群众性"}], "answers": ["A"], "explanation": "先进性是马克思主义政党的本质属性，是党的生命所系、力量所在。B项阶级性是党的属性之一，但作为「本质属性」「生命所系、力量所在」的标准提法是先进性；C项「全民性」提法与马克思主义政党性质相悖；D项群众性是党的优势但不是本质属性。教材对应「科学发展观的主要内容（党的建设）」。", "source": "MZT概论教研室公众号"}, {"id": 273, "chapter": "第8章 科学发展观", "type": "单选", "question": "科学发展观最鲜明的精神实质是：", "options": [{"key": "A", "text": "解放思想、实事求是、与时俱进、求真务实"}, {"key": "B", "text": "立党为公，执政为民"}, {"key": "C", "text": "实事求是、群众路线、独立自主"}, {"key": "D", "text": "真理性与实践性、科学性与开放性和历史性与时代性的统一"}], "answers": ["A"], "explanation": "科学发展观最鲜明的精神实质是「解放思想、实事求是、与时俱进、求真务实」。B项是执政理念；C项是MZD思想活的灵魂；D项是抽象论述，均不是科学发展观精神实质的标准表述。教材对应「科学发展观的历史地位」。", "source": "MZT概论教研室公众号"}, {"id": 274, "chapter": "第8章 科学发展观", "type": "单选", "question": "科学发展观（）", "options": [{"key": "A", "text": "创造性地回答了什么是社会主义、怎样建设社会主义"}, {"key": "B", "text": "创造性地建设什么样的党、怎样建设党的问题"}, {"key": "C", "text": "创造性地回答了新形势下实现什么样的发展、怎样发展等重大问题"}, {"key": "D", "text": "创造性地回答了新时代进行什么样的伟大革命、怎样进行伟大革命的问题"}], "answers": ["C"], "explanation": "科学发展观创造性地回答了新形势下「实现什么样的发展、怎样发展」等重大问题。A项是DXP理论回答的问题；B项是「三个代表」重要思想回答的问题；D项是新时代党面对的问题，但科学发展观特定回答的是发展问题。教材对应「科学发展观的历史地位」。", "source": "MZT概论教研室公众号"}, {"id": 275, "chapter": "第8章 科学发展观", "type": "单选", "question": "我们党的文件中第一次提出科学发展观是在：", "options": [{"key": "A", "text": "《中共中央关于完善社会主义市场经济体制若干问题的决定》中"}, {"key": "B", "text": "《中共中央关于加强党的执政能力建设的决定》中"}, {"key": "C", "text": "《中共中央关于构建社会主义和谐社会若干重大问题的决定》中"}, {"key": "D", "text": "《中共中央关于制定国民经济和社会发展第十一个五年规划的建议》中"}], "answers": ["A"], "explanation": "2003年党的十六届三中全会通过《中共中央关于完善社会主义市场经济体制若干问题的决定》，第一次在党的文件中正式提出科学发展观。B、C、D 三项时间均晚于该次全会，不是首次正式提出。教材对应「科学发展观形成的背景」。", "source": "MZT概论教研室公众号"}, {"id": 276, "chapter": "第8章 科学发展观", "type": "单选", "question": "科学发展观的核心立场是（）", "options": [{"key": "A", "text": "全面发展"}, {"key": "B", "text": "协调发展"}, {"key": "C", "text": "以人为本"}, {"key": "D", "text": "可持续发展"}], "answers": ["C"], "explanation": "资料库简答题明确：科学发展观核心立场是以人为本。A、B、D项是基本要求「全面协调可持续」的内容，不是核心立场。教材对应「科学发展观的科学内涵」。", "source": "MZT概论教研室公众号"}, {"id": 277, "chapter": "第8章 科学发展观", "type": "单选", "question": "科学发展观强调，推动经济持续健康发展，必须坚持的主题（）", "options": [{"key": "A", "text": "以人为本"}, {"key": "B", "text": "科学发展"}, {"key": "C", "text": "中国特色社会主义现代经济体系"}, {"key": "D", "text": "人的全面发展"}], "answers": ["B"], "explanation": "科学发展观强调推动经济持续健康发展必须坚持的主题是科学发展。A、D项是核心立场和发展目标；C项不是「主题」的标准表述。教材对应「科学发展观的主要内容（经济建设）」。", "source": "MZT概论教研室公众号"}, {"id": 278, "chapter": "第8章 科学发展观", "type": "单选", "question": "科学发展观强调，推动经济持续健康发展，必须坚持的主线是（）", "options": [{"key": "A", "text": "以人为本"}, {"key": "B", "text": "科学发展"}, {"key": "C", "text": "加快转变经济发展方式"}, {"key": "D", "text": "人的全面发展"}], "answers": ["C"], "explanation": "科学发展观强调推动经济持续健康发展必须坚持的主线是加快转变经济发展方式——以科学发展为主题、以加快转变经济发展方式为主线。A、D项是核心立场和发展目标；B项是主题，但本题问「主线」，答案为 C。教材对应「科学发展观的主要内容（经济建设）」。", "source": "MZT概论教研室公众号"}, {"id": 279, "chapter": "第8章 科学发展观", "type": "多选", "question": "科学发展观的集中概括为：", "options": [{"key": "A", "text": "第一要义是发展"}, {"key": "B", "text": "核心立场是以人为本"}, {"key": "C", "text": "基本要求是全面协调可持续"}, {"key": "D", "text": "根本方法是统筹兼顾"}], "answers": ["A", "B", "C", "D"], "explanation": "资料库简答题明确：科学发展观第一要义是发展（A）、核心立场是以人为本（B）、基本要求是全面协调可持续（C）、根本方法是统筹兼顾（D）。四项是科学发展观的集中概括。教材对应「科学发展观的科学内涵」。", "source": "MZT概论教研室公众号"}, {"id": 280, "chapter": "第8章 科学发展观", "type": "多选", "question": "以人为本是科学发展观的核心立场，集中体现了：", "options": [{"key": "A", "text": "马克思主义历史唯物论的基本原理"}, {"key": "B", "text": "体现了我们党全心全意为人民服务的根本宗旨"}, {"key": "C", "text": "推动经济社会发展的根本目的"}, {"key": "D", "text": "马克思主义中国化的独创性内容"}], "answers": ["A", "B", "C"], "explanation": "以人为本集中体现了：A 马克思主义历史唯物论的基本原理（人民是历史创造者）；B 我们党全心全意为人民服务的根本宗旨；C 推动经济社会发展的根本目的（造福人民）。D项「独创性内容」措辞偏离「以人为本」集中体现内容的标准表述。教材对应「科学发展观的核心立场（以人为本）」。", "source": "MZT概论教研室公众号"}, {"id": 281, "chapter": "第8章 科学发展观", "type": "多选", "question": "坚持科学发展，必须加快转变经济发展方式，促进经济增长：", "options": [{"key": "A", "text": "由主要依靠投资、出口拉动向依靠消费、投资、出口协调拉动转变"}, {"key": "B", "text": "由主要依靠第二产业带动向依靠第一、第二、第三产业协同带动转变"}, {"key": "C", "text": "由主要依靠增加物质资源消耗向主要依靠科技进步、劳动者素质提高、管理创新转变，"}, {"key": "D", "text": "不断提高发展的全面性、协调性、可持续性"}], "answers": ["A", "B", "C", "D"], "explanation": "加快转变经济发展方式的内容：A 由主要依靠投资、出口拉动向依靠消费、投资、出口协调拉动转变；B 由主要依靠第二产业带动向第一、第二、第三产业协同带动转变；C 由主要依靠物质资源消耗向主要依靠科技进步、劳动者素质提高、管理创新转变；D 不断提高发展的全面性、协调性、可持续性。四项均符合党对加快转变经济发展方式的论述。教材对应「科学发展观的主要内容（加快转变经济发展方式）」。", "source": "MZT概论教研室公众号"}, {"id": 282, "chapter": "第8章 科学发展观", "type": "多选", "question": "HJT指出：“我们提出以人为本的根本含义，就是坚持全心全意为人民服务,()”", "options": [{"key": "A", "text": "坚持尊重社会发展规律与尊重人民历史主体地位的一致性"}, {"key": "B", "text": "坚持为崇高理想奋斗与为最广大人民谋利益的一致性"}, {"key": "C", "text": "坚持完成党的各项工作与实现人民利益的一致性"}, {"key": "D", "text": "坚持发展为了人民、发展依靠人民、发展成果由人民共享"}], "answers": ["A", "B", "C", "D"], "explanation": "HJT指出以人为本的根本含义包括：A 坚持尊重社会发展规律与尊重人民历史主体地位的一致性；B 坚持为崇高理想奋斗与为最广大人民谋利益的一致性；C 坚持完成党的各项工作与实现人民利益的一致性；D 坚持发展为了人民、发展依靠人民、发展成果由人民共享。四项均符合「以人为本」的完整内涵。教材对应「科学发展观的核心立场（以人为本）」。", "source": "MZT概论教研室公众号"}, {"id": 283, "chapter": "第8章 科学发展观", "type": "多选", "question": "统筹兼顾是科学发展观的根本方法", "options": [{"key": "A", "text": "深刻体现了唯物辩证法在发展问题上的科学运用"}, {"key": "B", "text": "深刻揭示了实现科学发展、促进社会和谐的基本途径"}, {"key": "C", "text": "是正确处理经济社会发展中重大关系的方针原则"}, {"key": "D", "text": "是正确处理党际、国际问题的方针原则"}], "answers": ["A", "B", "C"], "explanation": "统筹兼顾：A 深刻体现了唯物辩证法在发展问题上的科学运用；B 深刻揭示了实现科学发展、促进社会和谐的基本途径；C 是正确处理经济社会发展中重大关系的方针原则。D项把统筹兼顾扩大到「党际、国际问题」超出了其作为发展观方法论的标准定位。教材对应「科学发展观的根本方法（统筹兼顾）」。", "source": "MZT概论教研室公众号"}, {"id": 284, "chapter": "第8章 科学发展观", "type": "多选", "question": "社会主义协商民主，充分体现了社会主义民主的：", "options": [{"key": "A", "text": "真实性"}, {"key": "B", "text": "广泛性"}, {"key": "C", "text": "包容性"}, {"key": "D", "text": "开放性"}], "answers": ["A", "B", "C"], "explanation": "社会主义协商民主充分体现了社会主义民主的真实性（A）、广泛性（B）、包容性（C）——它使民主决策更具科学性和合法性。D项「开放性」不属于协商民主体现社会主义民主的三大特性。教材对应「科学发展观的主要内容（社会主义民主政治）」。", "source": "MZT概论教研室公众号"}, {"id": 285, "chapter": "第8章 科学发展观", "type": "多选", "question": "科学发展观强调，建设社会主义文化强国。要坚定不移走中国特色社会主义文化发展道路：", "options": [{"key": "A", "text": "坚持为人民服务、为社会主义服务的方向"}, {"key": "B", "text": "坚持百花齐放、百家争鸣的方针，坚持贴近实际、贴近生活、贴近群众的原则"}, {"key": "C", "text": "推动社会主义精神文明和物质文明全面发展"}, {"key": "D", "text": "建设面向现代化、面向世界、面向未来的，民族的科学的大众的社会主义文化"}], "answers": ["A", "B", "C", "D"], "explanation": "建设社会主义文化强国，要坚定不移走中国特色社会主义文化发展道路：A 坚持「二为」方向（为人民服务、为社会主义服务）；B 坚持「双百」方针（百花齐放、百家争鸣）和「三贴近」原则（贴近实际、生活、群众）；C 推动精神文明和物质文明全面发展；D 建设「三个面向」的民族的科学的大众的社会主义文化。四项均正确。教材对应「科学发展观的主要内容（文化建设）」。", "source": "MZT概论教研室公众号"}, {"id": 286, "chapter": "第8章 科学发展观", "type": "多选", "question": "社会主义核心价值体系的基本内容：", "options": [{"key": "A", "text": "马克思主义指导思想"}, {"key": "B", "text": "中国特色社会主义共同理想"}, {"key": "C", "text": "以爱国主义为核心的民族精神和以改革创新为核心的时代精神"}, {"key": "D", "text": "社会主义荣辱观"}], "answers": ["A", "B", "C", "D"], "explanation": "社会主义核心价值体系基本内容包括：A 马克思主义指导思想（灵魂）；B 中国特色社会主义共同理想（主题）；C 以爱国主义为核心的民族精神和以改革创新为核心的时代精神（精髓）；D 社会主义荣辱观（基础）。四项构成完整的核心价值体系。教材对应「科学发展观的主要内容（文化建设、核心价值体系）」。", "source": "MZT概论教研室公众号"}, {"id": 287, "chapter": "第8章 科学发展观", "type": "多选", "question": "构建社会主义和谐社会的总要求：", "options": [{"key": "A", "text": "民主法治、公平正义"}, {"key": "B", "text": "诚信友爱、充满活力"}, {"key": "C", "text": "尊重自然、顺应自然、保护自然"}, {"key": "D", "text": "安定有序、人与自然和谐相处"}], "answers": ["A", "B", "D"], "explanation": "构建社会主义和谐社会的总要求是：A 民主法治、公平正义；B 诚信友爱、充满活力；D 安定有序、人与自然和谐相处。C项「尊重自然、顺应自然、保护自然」是生态文明理念的表述，不在和谐社会六句话总要求内（人与自然和谐相处即概括了 C 的核心精神）。教材对应「科学发展观的主要内容（构建社会主义和谐社会）」。", "source": "MZT概论教研室公众号"}, {"id": 288, "chapter": "第8章 科学发展观", "type": "多选", "question": "科学发展观强调，要倡导（）、倡导（），倡导（），积极培育和践行社会主义核心价值观。：", "options": [{"key": "A", "text": "富强、民主、文明、和谐"}, {"key": "B", "text": "自由、平等、公正、法治"}, {"key": "C", "text": "爱国、敬业、诚信、友善"}, {"key": "D", "text": "共商、共建、共治、共享"}], "answers": ["A", "B", "C"], "explanation": "社会主义核心价值观从三个层面提炼为：A 国家层面：富强、民主、文明、和谐；B 社会层面：自由、平等、公正、法治；C 公民层面：爱国、敬业、诚信、友善。D项「共商、共建、共治、共享」是社会治理理念表述，不属于社会主义核心价值观 12 个词的范围。教材对应「科学发展观的主要内容（社会主义核心价值观）」。", "source": "MZT概论教研室公众号"}, {"id": 289, "chapter": "第8章 科学发展观", "type": "多选", "question": "科学发展观强调，推进生态文明建设，必须树立的生态文明理念有：", "options": [{"key": "A", "text": "尊重自然"}, {"key": "B", "text": "顺应自然"}, {"key": "C", "text": "保护自然"}, {"key": "D", "text": "征服自然"}], "answers": ["A", "B", "C"], "explanation": "推进生态文明建设必须树立尊重自然（A）、顺应自然（B）、保护自然（C）的生态文明理念——这与传统「征服自然」思维形成根本区别。D项「征服自然」违背生态文明理念。教材对应「科学发展观的主要内容（生态文明建设）」。", "source": "MZT概论教研室公众号"}, {"id": 290, "chapter": "第8章 科学发展观", "type": "多选", "question": "科学发展观强调，建设生态文明，实质上就是要建设()的资源节约型、环境友好型社会。", "options": [{"key": "A", "text": "以资源环境承载力为基础"}, {"key": "B", "text": "以自然规律为准则"}, {"key": "C", "text": "以可持续发展为目标"}, {"key": "D", "text": "以消费改造为主导"}], "answers": ["A", "B", "C"], "explanation": "建设生态文明，实质上就是要建设以资源环境承载力为基础（A）、以自然规律为准则（B）、以可持续发展为目标（C）的资源节约型、环境友好型社会。D项「以消费改造为主导」措辞不规范，不是党的标准提法。教材对应「科学发展观的主要内容（生态文明建设）」。", "source": "MZT概论教研室公众号"}, {"id": 291, "chapter": "第8章 科学发展观", "type": "多选", "question": "HJT指出：“新形势下，党面临()的是长期的、复杂的、严峻的”", "options": [{"key": "A", "text": "执政考验"}, {"key": "B", "text": "改革开放考验"}, {"key": "C", "text": "外部环境考验"}, {"key": "D", "text": "市场经济考验"}], "answers": ["A", "B", "C", "D"], "explanation": "HJT指出新形势下党面临的「四大考验」：执政考验（A）、改革开放考验（B）、市场经济考验（D）、外部环境考验（C），是长期的、复杂的、严峻的。四项即「四大考验」。教材对应「科学发展观的主要内容（党的建设）」。", "source": "MZT概论教研室公众号"}, {"id": 292, "chapter": "第8章 科学发展观", "type": "多选", "question": "HJT指出：“新形势下…… ()更加尖锐地摆在全党面前。”：", "options": [{"key": "A", "text": "精神懈怠危险"}, {"key": "B", "text": "能力不足危险"}, {"key": "C", "text": "脱离群众危险"}, {"key": "D", "text": "消极腐败危险"}], "answers": ["A", "B", "C", "D"], "explanation": "HJT指出新形势下党面临的「四大危险」：精神懈怠危险（A）、能力不足危险（B）、脱离群众危险（C）、消极腐败危险（D）更加尖锐地摆在全党面前。四项即「四大危险」。教材对应「科学发展观的主要内容（党的建设）」。", "source": "MZT概论教研室公众号"}, {"id": 293, "chapter": "第8章 科学发展观", "type": "多选", "question": "科学发展观强调，执政能力建设是党执政后的一项根本建设。党要不断提高:", "options": [{"key": "A", "text": "驾驭社会主义市场经济的能力"}, {"key": "B", "text": "发展社会主义民主政治的能力"}, {"key": "C", "text": "建设社会主义先进文化的能力、构建社会主义和谐社会的能力"}, {"key": "D", "text": "推进社会主义生态文明建设的能力、应对国际局势和处理国际事务的能力"}], "answers": ["A", "B", "C", "D"], "explanation": "党要不断提高的执政能力涵盖：A 驾驭社会主义市场经济能力；B 发展社会主义民主政治能力；C 建设先进文化能力、构建和谐社会能力；D 推进生态文明建设能力、应对国际局势和处理国际事务能力。四项均符合党执政能力建设的内容。教材对应「科学发展观的主要内容（党的执政能力建设）」。", "source": "MZT概论教研室公众号"}, {"id": 294, "chapter": "第8章 科学发展观", "type": "多选", "question": "科学发展观的历史地位是指:", "options": [{"key": "A", "text": "中国特色社会主义理论体系的接续发展"}, {"key": "B", "text": "发展中国特色社会主义必须长期坚持的指导思想"}, {"key": "C", "text": "科学发展观仅是指导经济建设的理论"}, {"key": "D", "text": "政党执政规律的总体认识"}], "answers": ["A", "B"], "explanation": "科学发展观历史地位：A 中国特色社会主义理论体系的接续发展；B 发展中国特色社会主义必须长期坚持的指导思想。C项错误，科学发展观不仅是经济建设理论，是党关于发展的全面世界观和方法论；D项措辞不规范，不是党的标准表述。教材对应「科学发展观的历史地位」。", "source": "MZT概论教研室公众号"}, {"id": 295, "chapter": "第8章 科学发展观", "type": "多选", "question": "科学发展观形成的条件有（）", "options": [{"key": "A", "text": "党带领人民战胜各种风险挑战、坚持和发展中国特色社会主义的成功探索"}, {"key": "B", "text": "社会主义初级阶段基本国情和新的阶段性特征"}, {"key": "C", "text": "当今世界发展大势、国外发展的经验教训"}, {"key": "D", "text": "科学判断党的历史方位和总结历史经验"}], "answers": ["A", "B", "C"], "explanation": "科学发展观形成的条件：A 党带领人民战胜各种风险挑战、坚持和发展中国特色社会主义的成功探索（实践基础）；B 社会主义初级阶段基本国情和新的阶段性特征（现实基础）；C 当今世界发展大势、国外发展的经验教训（国际背景）。D项偏向党的发展史方法论，不属于科学发展观特定形成条件的标准列表。教材对应「科学发展观形成的条件」。", "source": "MZT概论教研室公众号"}, {"id": 296, "chapter": "第8章 科学发展观", "type": "多选", "question": "科学发展观是 ()", "options": [{"key": "A", "text": "马克思主义关于发展的世界观和方法论的集中体现"}, {"key": "B", "text": "中国特色社会主义理论体系的重要组成部分"}, {"key": "C", "text": "发展中国特色社会主义必须长期坚持的指导思想"}, {"key": "D", "text": "初步构建了中国特色社会主义理论框架"}], "answers": ["A", "B", "C"], "explanation": "科学发展观：A 是马克思主义关于发展的世界观和方法论的集中体现；B 是中国特色社会主义理论体系的重要组成部分；C 是发展中国特色社会主义必须长期坚持的指导思想。D项错误，「初步构建中国特色社会主义理论框架」是DXP理论的历史地位，不是科学发展观。教材对应「科学发展观的历史地位」。", "source": "MZT概论教研室公众号"}, {"id": 297, "chapter": "第8章 科学发展观", "type": "多选", "question": "科学发展观同DXP理论、“三个代表”重要思想，面对着共同的时代课题，面临着共同的历史任务，都（）", "options": [{"key": "A", "text": "贯穿了中国特色社会主义这个主题"}, {"key": "B", "text": "坚持辩证唯物主义和历史唯物主义的世界观方法论"}, {"key": "C", "text": "坚持党的最高纲领和最低纲领的统一"}, {"key": "D", "text": "坚持代表最广大人民根本利益"}], "answers": ["A", "B", "C", "D"], "explanation": "三者共同点：A 贯穿了中国特色社会主义这个主题；B 坚持辩证唯物主义和历史唯物主义的世界观方法论；C 坚持党的最高纲领和最低纲领的统一；D 坚持代表最广大人民根本利益。四项均是三大理论共同的逻辑特征。教材对应「科学发展观的历史地位（与DXP理论、「三个代表」重要思想的关系）」。", "source": "MZT概论教研室公众号"}, {"id": 298, "chapter": "第8章 科学发展观", "type": "多选", "question": "构建和谐社会的总要求中“人与自然和谐相处”就是:", "options": [{"key": "A", "text": "生产发展"}, {"key": "B", "text": "生活富裕"}, {"key": "C", "text": "生态良好"}, {"key": "D", "text": "生物多样"}], "answers"
